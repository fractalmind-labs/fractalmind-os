name: "Agent Console: Android build"

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - apps/agent-console/**
      - .github/workflows/agent-console-android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/agent-console/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: pnpm install
      - name: Build web
        run: pnpm build
      - name: Add & sync Android (Capacitor)
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-console-android-debug
          if-no-files-found: error
          path: apps/agent-console/android/app/build/outputs/apk/debug/*.apk
