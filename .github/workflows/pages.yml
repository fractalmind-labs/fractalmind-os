name: Pages

# Publishes the docs site at the Pages root and the explorer under /explorer/.
on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - apps/explorer/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            docs/site/package-lock.json
            apps/explorer/package-lock.json

      - uses: actions/configure-pages@v5

      - name: Build docs
        working-directory: docs/site
        run: |
          npm ci
          npm run docs:build

      - name: Build explorer
        working-directory: apps/explorer
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/site/docs/.vitepress/dist/. _site/
          cp -R apps/explorer/dist _site/explorer

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
