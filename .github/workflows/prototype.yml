name: FractalMind prototype

on:
  pull_request:
    paths:
      - docs/product/fractalmind-app-prototype/**
      - .github/workflows/prototype.yml
  push:
    branches: [main]
    paths:
      - docs/product/fractalmind-app-prototype/**
      - .github/workflows/prototype.yml

permissions:
  contents: read

jobs:
  verify:
    name: Prototype state regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/product/fractalmind-app-prototype/verify.cjs
