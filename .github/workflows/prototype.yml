name: FractalMind prototype

on:
  pull_request:
    paths:
      - docs/product/fractalmind-app-prototype/**
      - docs/product/fractalmind-app-prototype-v2/**
      - .github/workflows/prototype.yml
  push:
    branches: [main]
    paths:
      - docs/product/fractalmind-app-prototype/**
      - docs/product/fractalmind-app-prototype-v2/**
      - .github/workflows/prototype.yml

permissions:
  contents: read

jobs:
  verify:
    name: Prototype state regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/product/fractalmind-app-prototype/verify.cjs

  verify-v2:
    name: Prototype v2 model regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/product/fractalmind-app-prototype-v2/verify.cjs
      - name: App components match the prototype styles
        run: node apps/fractalmind-app/scripts/port-prototype-v2-components.mjs --check
