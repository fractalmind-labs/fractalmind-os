name: python-compatibility

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python version
        run: python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Static compile sanity
        run: python3 -m compileall -q agent-manager

      - name: Test basic CLI commands
        run: |
          # Test that basic commands don't crash on startup
          python3 agent-manager/scripts/main.py doctor
          python3 agent-manager/scripts/main.py list
          python3 agent-manager/scripts/main.py status --help
          python3 agent-manager/scripts/main.py --help

      - name: Import test (validates type annotations)
        run: |
          # Import all main modules to catch PEP 604 syntax errors on Python 3.9
          python3 -c "
          from agent_manager.scripts.commands import lifecycle
          from agent_manager.scripts.commands import doctor
          from agent_manager.scripts.commands import heartbeat
          from agent_manager.scripts.services import heartbeat_state_machine
          from agent_manager.scripts.services import work_schedule
          print('All imports successful')
          "

      - name: Unit tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml
          python3 -m unittest discover -s agent-manager/scripts/tests -p 'test_*.py' -v
