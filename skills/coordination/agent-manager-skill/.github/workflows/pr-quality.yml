name: pr-quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      QUALITY_COVERAGE_MIN: ${{ vars.QUALITY_COVERAGE_MIN || '45' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (if present)
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          else
            python3 -m pip install pyyaml
          fi
          python3 -m pip install coverage

      - name: Static compile sanity
        run: python3 -m compileall -q agent-manager

      - name: Unit tests
        run: python3 -m unittest discover -s agent-manager/scripts/tests -p 'test_*.py' -v

      - name: Coverage gate
        run: |
          python3 -m coverage run -m unittest discover -s agent-manager/scripts/tests -p 'test_*.py' -v
          python3 -m coverage report --show-missing --fail-under=${QUALITY_COVERAGE_MIN}
