const textSources=new WeakMap(),attributeSources=new WeakMap();
const localeWords=Object.keys(EN).sort((a,b)=>b.length-a.length);
const localePattern=new RegExp(localeWords.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const seededText=new Set();
function collectSeedText(value){if(typeof value==='string')seededText.add(value);else if(Array.isArray(value))value.forEach(collectSeedText);else if(value&&typeof value==='object')Object.values(value).forEach(collectSeedText);}
collectSeedText(defaults());
function translateText(source){
  if(preferences.locale!=='en')return source;
  // Exact messages first; fragments cover labels composed with dynamic metrics or agent names.
  const trimmed=source.trim();if(Object.hasOwn(EN,trimmed))return source.replace(trimmed,EN[trimmed]);
  const translated=source.replace(localePattern,key=>' '+EN[key]+' ').replace(/[ \t]{2,}/g,' ').replace(/，/g,', ').replace(/。/g,'. ').replace(/：/g,': ').replace(/；/g,'; ').replace(/（/g,' (').replace(/）/g,') ').replace(/、/g,', ');

}
function localizedText(source){return translateText(String(source??''));}
function applyTheme(){
  const dark=preferences.theme==='dark'||preferences.theme==='system'&&systemTheme.matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.colorScheme=dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]').content=dark?'#151d1b':'#fafbf8';
  document.querySelectorAll('[data-theme-choice]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.themeChoice===preferences.theme)));

function translateDOM(root=document.body){
  const blocked=el=>el.closest('script,style,[translate="no"],.terminal-window,.host-terminal');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
  while(node=walker.nextNode()){
    if(!node.parentElement||blocked(node.parentElement)||node.parentElement.closest('textarea'))continue;
    const previous=textSources.get(node);
    const source=previous&&node.nodeValue===previous.rendered?previous.source:node.nodeValue;
    // Authored objective names, notes and agreements retain their original language.
    if(node.parentElement.closest('[data-i18n-content]')&&!seededText.has(source.trim()))continue;
    const rendered=translateText(source);if(node.nodeValue!==rendered)node.nodeValue=rendered;
    textSources.set(node,{source,rendered});
  }
  for(const el of [...(root.matches?.('[aria-label],[title],[placeholder]')?[root]:[]),...root.querySelectorAll('[aria-label],[title],[placeholder]')]){
    if(blocked(el))continue;
    const saved=attributeSources.get(el)||{};
    for(const key of ['aria-label','title','placeholder']){
      if(!el.hasAttribute(key))continue;
      const current=el.getAttribute(key),prior=saved[key],source=prior&&current===prior.rendered?prior.source:current;

    }
    attributeSources.set(el,saved);
  }
  document.documentElement.lang=preferences.locale;
  document.title=preferences.locale==='en'?'FractalMind — Intelligence grows together':'FractalMind — 你的智能，从这里生长';
  document.querySelectorAll('[data-locale-picker]').forEach(el=>{el.value=preferences.locale;});

}
function updatePreference(key,value){

}

const presentationObserver=new MutationObserver(records=>{

  const roots=new Set();for(const record of records){const el=record.target.nodeType===Node.ELEMENT_NODE?record.target:record.target.parentElement;if(el&&!el.closest('script,style'))roots.add(el);}

});

function krComplete(k){return metricMet(k)&&k.verified&&k.evidence.some(e=>e.valid);}

function krRow(g,k){const ready=k.depends.every(id=>krComplete(g.krs.find(x=>x.id===id))),pct=Math.round(krProgress(k));return `<button class="kr-row" data-action="kr-detail" data-id="${g.id}" data-kr="${k.id}"><div class="row wrap"><span class="kr-index">${k.id.toUpperCase()}</span><span class="badge ${krComplete(k)?'green':k.status==='IN PROGRESS'?'blue':''}">${k.status}</span><span class="spacer"></span><span class="muted">权重 ${Math.round(k.weight/g.krs.reduce((n,x)=>n+x.weight,0)*100)}%</span></div><h3 data-i18n-content>${esc(k.title)}</h3><div class="row between"><div class="kr-measure"><strong>${k.current}</strong><span>/ ${k.target} ${esc(k.unit)}</span></div><strong class="kr-pct">${pct}%</strong></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row between wrap"><span class="muted">${!ready?'等待 '+k.depends.map(x=>x.toUpperCase()).join('、'):krComplete(k)?'证据验证通过':metricMet(k)?'指标达标 · 待证据验证':'基线 '+k.baseline+' '+esc(k.unit)+' · '+(k.target>k.baseline?'提升型':'降低型')}</span><span class="link-btn">查看证据 ${icon('arrow')}</span></div></button>`;}

function executeHeartbeat(g){
  if(g.lifecycle!=='ACTIVE')return false;

  if(g.spent+cost>g.budget){stopOKR(g,`下一步预计 $${cost.toFixed(2)}，剩余 $${(g.budget-g.spent).toFixed(2)}。预算不足，等待调整。`);return false;}

  if(metricMet(k)){k.verified=true;k.status='COMPLETE';k.evidence.push({at:now,hostId:g.hostId,instanceId:assignedInstance(g)?.id,value:k.current,text:k.verification,verifier:'预授权验证器 · 演示',valid:true});logOKR(g,`${k.id.toUpperCase()} 证据验证通过；检查下游依赖并自主安排下一步。`);state.tasks.filter(t=>t.goal===g.id&&t.kr===k.id).forEach(t=>{t.status='done';t.history.push({text:'预授权验证器检查 KR 证据通过，执行任务归档（演示）',icon:'checkCircle'});});}
  else{const step=Math.abs(k.target-k.baseline)/3,dir=Math.sign(k.target-k.baseline);const value=k.current+dir*step;k.current=Math.round((dir>0?Math.min(k.target,value):Math.max(k.target,value))*100)/100;k.verified=false;k.updated=now;k.evidence.push({at:now,hostId:g.hostId,instanceId:assignedInstance(g)?.id,value:k.current,text:`${k.deliverable}：本轮测量 ${k.current} ${k.unit}；${metricMet(k)?'达到阈值，下一轮复核证据':'继续调整执行计划'}`,verifier:agentFor(g.owner).name+' · 演示采样',valid:false});logOKR(g,`${k.id.toUpperCase()} 自主推进：实测 ${k.current} ${k.unit}，${metricMet(k)?'等待证据验证':'更新计划并继续执行'}。`);let t=state.tasks.find(t=>t.goal===g.id&&t.kr===k.id&&t.status!=='done');if(!t){t={id:'t'+Date.now(),goal:g.id,kr:k.id,name:'采集并验证「'+k.title+'」的结果',agent:g.owner,status:'running',detail:k.verification,history:[],messages:[]};state.tasks.push(t);}t.status='running';}

}

function newGoal(prefill=''){openOverlay(`<section class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('把方向，交给你的 Agent。','你确认结果与边界，执行计划由 Agent 自主拆解。','target')}<form id="new-okr-form"><label class="field">Objective · 想达成什么结果<input name="objective" value="${esc(prefill)}" required maxlength="160" placeholder="例如：让核心协作流程在五个平台稳定可用"></label><label class="field">Success Criteria · 怎样算整个目标达成<textarea name="criteria" required maxlength="1000" placeholder="1–3 条可量化、能明确判定通过或不通过的标准；需由下方 KR 的验证覆盖。"></textarea></label><div class="detail-grid"><label class="field">负责人<select name="owner">${agents.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></label><label class="field">优先级<select name="priority"><option>P0</option><option selected>P1</option><option>P2</option></select></label></div><div id="kr-editors">${krEditor(1)}</div><button class="btn small" type="button" data-action="add-kr">${icon('plus')}添加关键结果</button><p class="muted" style="font-size:11px;margin-top:10px">原型支持 1–3 个 KR；权重自动归一化。新增模块、运行测试等步骤交给 Agent 拆成任务。</p><div class="detail-grid"><label class="field">截止日期<input name="deadline" type="date" value="${new Date(Date.now()+14*86400000).toISOString().slice(0,10)}" required></label><label class="field">费用上限（USD）<input name="budget" type="number" min="1" max="10000" step="0.01" value="30" required></label></div><label class="field">工作范围<input name="scope" value="fractalmind-os 工作区" required maxlength="200"></label><label class="field">可自主执行<input name="allowed" value="读取、修改项目文件、运行本地检查、自主拆分任务" required maxlength="300"></label><label class="field">需要升级确认<input name="escalate" value="公开发布、跨空间访问、外部付费服务、扩大预算" required maxlength="400"></label><label class="check-row"><input name="confirmed" type="checkbox" required>我确认成功标准已被 KR 覆盖，并授权按上述验证方式自动验收。</label><label class="field">保存方式<select name="lifecycle"><option value="ACTIVE" ${activeOKRs().length>=3?'disabled':''}>确认并自主推进 · ACTIVE</option><option value="CANDIDATE" ${activeOKRs().length>=3?'selected':''}>保存候选，暂不执行 · CANDIDATE</option></select><small>当前 ${activeOKRs().length}/3 个 ACTIVE；达到上限后进入候选池。</small></label><div class="dialog-footer"><button class="btn" type="button" data-action="close">取消</button><button class="btn primary" type="submit">确认并保存 OKR</button></div></form></section>`);}
function submitOKR(form,data){
  const val=n=>String(data.get(n)||'').trim(),count=form.querySelectorAll('[data-editor]').length,krs=[];
  for(let i=1;i<=count;i++){const baseline=Number(val('base'+i)),target=Number(val('target'+i)),weight=Number(val('weight'+i));if(!Number.isFinite(baseline)||!Number.isFinite(target)||baseline===target||!Number.isFinite(weight)||weight<=0)return toast('KR 的基线与目标必须不同，且权重大于 0');krs.push({id:'kr'+i,title:val('krTitle'+i),baseline,current:baseline,target,unit:val('unit'+i),weight,depends:val('depends'+i)?[val('depends'+i)]:[],deliverable:val('deliverable'+i),verification:val('verify'+i),status:'PENDING',verified:false,evidence:[],updated:'尚未采样'});}
  if(!/\d/.test(val('criteria')))return toast('成功标准需包含至少一个明确的可量化指标');
  const lifecycle=val('lifecycle');if(lifecycle==='ACTIVE'&&activeOKRs().length>=3)return toast('最多 3 个 ACTIVE OKR，请保存为候选');
  const g={id:'g'+Date.now(),name:val('objective'),description:'由你定义结果，Agent 在约定的边界内自主推进。',criteria:val('criteria'),owner:val('owner'),priority:val('priority'),deadline:val('deadline'),budget:Number(val('budget')),spent:0,scope:val('scope'),allowed:val('allowed'),escalate:val('escalate'),lifecycle,krs,auto:false,blocker:null,request:null,tick:0,series:[{label:'开始',value:0}],audit:[],label:'我的 OKR',color:'green'};
  logOKR(g,lifecycle==='ACTIVE'?'你确认了 OKR、验证方式与边界，授权自主推进。':'OKR 已进入候选池，等待激活。');state.goals.unshift(g);okrFilter='all';if(lifecycle==='ACTIVE'){watchedOKR=g.id;go('home');startAutonomy(g);}else go('tasks',g.id);toast(lifecycle==='ACTIVE'?'OKR 已确认，开始演示自主推进':'候选 OKR 已保存');
}
function exportOKRs(){const list=activeOKRs();const body='# OKR\n\n> FractalMind 产品原型导出；全部指标、证据与授权为演示。\n\n'+list.map(g=>`### OKR ${g.name} — ACTIVE ${g.priority}\n\n**Owner**: ${agentFor(g.owner).name}\n\n**Deadline**: ${g.deadline}\n\n#### Objective\n${g.name}\n\n#### Success Criteria\n${g.criteria}\n\n#### Key Results\n${g.krs.map(k=>`\n**${k.id.toUpperCase()}: ${k.title}** — ${k.status}\n- Deliverable: ${k.deliverable}\n- Depends on: ${k.depends.join(', ')||'None'}\n- Outcome: ${k.baseline} → ${k.current} / ${k.target} ${k.unit}\n- Verification: ${k.verification}\n- Weight: ${k.weight}\n- Evidence (demo): ${k.evidence.map(e=>e.text).join('; ')||'None'}\n`).join('')}\n#### Execution Constraints\n- Scope: ${g.scope}\n- Allowed: ${g.allowed}\n- Escalate: ${g.escalate}\n- Budget: USD ${g.spent}/${g.budget}\n\n#### Tasks / Milestones\n${state.tasks.filter(t=>t.goal===g.id).map(t=>`- [${t.status==='done'?'x':' '}] ${t.name} — ${t.kr?.toUpperCase()} / ${agentFor(t.agent).name}`).join('\n')}\n`).join('\n---\n\n');const url=URL.createObjectURL(new Blob([body],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='OKR.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 ACTIVE OKR；候选与已达成记录保留在完整数据导出中');}

function hostById(id){return fleet().hosts.find(h=>h.id===id);}
function coordinatorFor(h){return fleet().coordinators.find(c=>c.id===h.coordinator);}
function hostState(h){return !h?'missing':!coordinatorFor(h)?.connected?'unknown':h.status;}
function hostReachable(h){return !state.offline&&['online','degraded'].includes(hostState(h));}
function hostInstances(h){return fleet().instances.filter(a=>a.hostId===h.id);}
function hostGoals(h){return state.goals.filter(g=>g.hostId===h.id&&g.lifecycle==='ACTIVE');}
function goalHost(g){fleet();return hostById(g.hostId);}
function assignedInstance(g){return fleet().instances.find(a=>a.hostId===g.hostId&&a.role===g.owner);}
function hostBadge(h){const s=hostState(h),labels={online:['在线','green'],degraded:['资源紧张','amber'],offline:['离线',''],pending:['待上线','blue'],unknown:['连接未知',''],missing:['未分配','']};const [label,color]=labels[s]||labels.unknown;return `<span class="badge ${color}"><span class="dot ${color==='amber'?'amber':color==='green'?'':'gray'}"></span>${label}</span>`;}
function hostIcon(h){return h.kind==='cloud'?'globe':h.os.startsWith('macOS')?'laptop':'org';}
function hostLog(h,text){h.audit.push({at:new Date().toLocaleTimeString(preferences.locale,{hour12:false}),text});h.audit=h.audit.slice(-60);}
function hostAgentSummary(role){const hosts=fleet().hosts.filter(h=>hostInstances(h).some(a=>a.role===role));return hosts.length?hosts.map(h=>h.name).join('、'):'未部署';}
function hostEligibility(g,h){if(g.lifecycle==='ACHIEVED')return 'OKR 已归档';if(!hostReachable(h))return '主机不可达';if(hostState(h)==='degraded')return '资源紧张';if(!h.accepting)return '已暂停接单';if(h.workspace!==g.scope)return '工作区未授权或未同步';if(!hostInstances(h).some(a=>a.role===g.owner&&a.status!=='stopped'))return '缺少可用的责任 Agent';return '';}
function hostExecutionProblem(g){const h=goalHost(g);if(!hostReachable(h))return {id:'unknown',color:'',label:'执行主机失联',reason:`${h?.name||'未分配主机'} 无法确认执行状态；保留最后结果，其他主机不受影响。`,next:'恢复主机连接并核对最后结果，再继续或改派。',action:'nav-host',button:'查看执行主机',boundary:'当前不可确认',activity:'执行位置未知'};if(h.workspace!==g.scope)return {id:'host-scope',color:'amber',label:'主机工作区不匹配',reason:'当前 OKR 的工作范围与执行主机授权不一致。',next:'在约定范围内选择已授权的执行主机。',action:'nav-host',button:'查看主机授权',boundary:'已拦截',activity:'等待工作区对齐'};const instance=assignedInstance(g);if(!instance||instance.status==='stopped')return {id:'agent-paused',color:'',label:'主机上的 Agent 已停止',reason:'当前执行实例不可用，已保留 OKR 结果。',next:'恢复执行实例后，明确继续推进。',action:'nav-host',button:'管理执行实例',boundary:'暂停执行',activity:'等待实例恢复'};return null;}

function hostConsole(h){return `<section class="card host-console"><div class="row between"><h3>远程控制台</h3><span class="badge">通过 ${esc(coordinatorFor(h)?.name)} · 演示</span></div><p class="muted" style="font-size:11px;margin-top:9px">命令发往当前选中的主机与实例；执行结果按命令保留。</p><form id="fleet-command-form" data-id="${h.id}"><div class="host-command-fields"><label class="field">操作<select name="command" id="host-command-kind">${[['status','节点状态'],['logs','Agent 日志'],['restart','重启 Agent'],['kill','停止 Agent'],['shell','Shell 命令']].map(([v,l])=>`<option value="${v}">${l} · ${v}</option>`).join('')}</select></label><label class="field">Agent 实例<select name="instance" aria-label="命令目标 Agent" disabled>${hostInstances(h).map(a=>`<option value="${a.id}">${agentFor(a.role).name} · ${esc(a.id)}</option>`).join('')}</select></label><label class="field host-command-args">参数<input name="args" maxlength="500" aria-label="远程命令参数" placeholder="此操作无需参数" disabled></label><button class="btn primary" type="submit" ${!hostReachable(h)?'disabled':''}>运行演示命令</button></div></form><div class="console-output" role="log" aria-label="远程命令回执">${h.commands.length?h.commands.slice(-8).map(c=>`<div><small>${esc(c.at)} · ${esc(h.name)} · ${esc(c.command)}</small><pre translate="no">${esc(c.output)}</pre></div>`).join(''):'<div><small>FRACTALMIND / REMOTE CONSOLE</small><pre>选择一项操作，查看该主机的模拟回执。\n未建立真实连接，Shell 内容不会被执行。</pre></div>'}</div></section>`;}
function hostDesktop(h){if(!h.desktop)return `<section class="card empty">${icon('laptop')}<h3>这台主机没有图形会话</h3><p>仍可通过远程控制台管理 Agent、读取日志和执行命令。</p><button class="btn" data-fleet="tab" data-id="console">打开控制台</button></section>`;if(desktopDemo.hostId!==h.id)desktopDemo={hostId:h.id,control:false,quality:'clear',zoom:1,touch:'touchpad',stats:false,clicks:0,text:''};const d=desktopDemo,live=hostReachable(h);return `<section class="remote-workspace"><div class="desktop-tools"><span class="badge ${live?'green':''}">${live?'演示画面':'连接中断'}</span><label>画质<select id="desktop-quality" aria-label="远程桌面画质">${[['smooth','流畅 · 720p'],['clear','清晰 · 1080p'],['sharp','精细 · 1440p']].map(([v,l])=>`<option value="${v}" ${d.quality===v?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn small" data-fleet="desktop-zoom" data-id="out" aria-label="缩小远程桌面">−</button><button class="btn small" data-fleet="desktop-zoom" data-id="fit">适应</button><button class="btn small" data-fleet="desktop-zoom" data-id="in" aria-label="放大远程桌面">＋</button><button class="btn small ${d.control?'soft':''}" data-fleet="desktop-control" ${!canOperate()||!live?'disabled':''}>${icon(d.control?'lock':'play')}${d.control?'释放控制':'开始控制（演示）'}</button><button class="btn small" data-fleet="desktop-reconnect" ${!live?'disabled':''}>重新连接</button><button class="icon-btn" data-fleet="desktop-stats" aria-label="桌面连接统计">${icon('info')}</button></div>${d.stats?`<div class="desktop-stats">模拟统计 · ${live?'RTT 28ms · 30fps · 丢包 0.2%':'观测不可用'} · ${d.quality==='smooth'?'2':d.quality==='sharp'?'8':'4'} Mbps · ${Math.round(d.zoom*100)}%</div>`:''}
  <div class="desktop-stage"><div class="desktop-scene ${live?'':'disconnected'}" style="transform:scale(${d.zoom})"><div class="desktop-menubar"><strong data-i18n-content>${esc(h.name)}</strong><span>${esc(h.os)} · 模拟桌面</span></div><div class="desktop-window"><div class="desktop-window-bar"><i></i><i></i><i></i><span>Agent Workspace</span></div><div class="desktop-window-body"><div class="eyebrow" data-i18n-content>${esc(h.workspace)}</div><h3>${hostGoals(h).length?'正在为你的目标工作':'执行环境已就绪'}</h3><p>${hostGoals(h).map(g=>esc(agentFor(g.owner).name+' · '+currentKR(g).id.toUpperCase())).join(' / ')||'等待分配 OKR'}</p><pre>runtime: ready\nnode: ${esc(h.id)}\nagents: ${hostInstances(h).length}\n${d.text?'input (demo): <span translate="no">'+esc(d.text)+'</span>':'等待授权内的下一步动作。'}</pre><button class="btn small" data-fleet="desktop-click" ${!live?'disabled':''}>${icon('folder')}打开工作区（演示）</button>${d.clicks?`<small>已收到 ${d.clicks} 次模拟点击</small>`:''}</div></div><div class="desktop-dock">${['folder','code','agents','target','settings'].map(ic=>`<span>${icon(ic)}</span>`).join('')}</div></div>${!live?'<div class="desktop-lost">画面已过期 · 输入已停止<br><small>恢复主机连接后，重新选择控制模式。</small></div>':''}</div>

function fleetAddHost(){openOverlay(`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('接入一台执行主机','先归属到一个工作区，再等待主机注册与授权。','laptop')}<form id="fleet-add-host-form"><label class="field">主机名称<input name="name" required maxlength="60" placeholder="例如：家中 Mini 03"></label><div class="detail-grid"><label class="field">部署位置<select name="kind"><option value="local">本地 / 小主机</option><option value="cloud">云端服务器</option></select></label><label class="field">操作系统<select name="os"><option>Ubuntu · amd64</option><option>macOS · arm64</option><option>Windows · amd64</option></select></label></div><label class="field">连接工作区<select name="coordinator">${fleet().coordinators.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label class="field">机房 / 标签<input name="location" required maxlength="50" placeholder="例如：家中机柜 / 东京"></label><label class="check-row"><input name="desktop" type="checkbox">该主机有可共享的图形桌面</label><div class="notice">演示接入将建立待上线记录，并配置 fractalmind-os 工作区与默认 Builder。真实流程需要主机端运行时注册、身份核验及明确授权。</div><div class="dialog-footer"><button class="btn" type="button" data-action="close">取消</button><button class="btn primary">创建接入记录</button></div></form></section>`);}
function fleetCoordinators(){openOverlay(`<section class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('统一管理连接','一个 App 可以连接多个自托管工作区。','link')}<div style="margin-top:20px">${fleet().coordinators.map(c=>`<div class="coordinator-row"><span class="avatar">${icon('org')}</span><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.url)}</small></div><span class="badge ${c.connected?'green':''}">${c.connected?'演示连接':'已断开'}</span><button class="btn small" data-fleet="coordinator-toggle" data-id="${c.id}" ${!canOperate()?'disabled':''}>${c.connected?'断开演示连接':'模拟重新连接'}</button></div>`).join('')}</div><form id="fleet-coordinator-form"><h3 style="margin-top:24px">添加连接</h3><div class="detail-grid"><label class="field">工作区名称<input name="name" required maxlength="50" placeholder="例如：办公室"></label><label class="field">Coordinator 地址<input name="url" required maxlength="180" placeholder="https://coordinator.example.com"></label></div><div class="notice">当前只保存演示连接信息，不发出网络请求。真实接入需要验证 Coordinator 并保存授权凭据；本原型不收集 Token。</div><div class="dialog-footer"><button class="btn" type="button" data-action="close">完成</button><button class="btn primary" ${!canOperate()?'disabled':''}>模拟验证并连接</button></div></form></section>`);}
function fleetAssign(g){const source=goalHost(g),canMove=hostReachable(source);openOverlay(`<section class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('选择这个 OKR 的执行主机',esc(g.name),'laptop')}<p class="muted" style="font-size:12px;margin-top:16px">当前：${esc(source?.name)} · ${esc(agentFor(g.owner).name)}</p>${!canMove?'<div class="notice amber" style="margin-top:14px">源主机失联，尚不能确认旧操作是否仍在执行。请先恢复源机连接并核对结果，再进行改派。</div>':''}<div style="margin-top:16px">${fleet().hosts.map(h=>{const reason=hostEligibility(g,h);return `<button class="choice-card" data-fleet="assign-confirm" data-id="${g.id}" data-host="${h.id}" ${reason||!canMove||!canOperate()||h.id===g.hostId?'disabled':''}><span class="avatar">${icon(hostIcon(h))}</span><span class="grow"><strong data-i18n-content>${esc(h.name)} ${h.id===g.hostId?'· 当前':''}</strong><small>${reason||`${h.kind==='cloud'?'云端':'本地'} · 同一工作区 · 可用 ${agentFor(g.owner).name}`}</small></span>${hostBadge(h)}</button>`;}).join('')}</div><div class="notice" style="margin-top:15px">改派会暂停旧循环、保留已记录的 KR 指标与证据，在新主机上等待你继续。文件与运行中进程的迁移不在此演示中执行。</div><div class="dialog-footer"><button class="btn" data-action="close">返回导航</button></div></section>`);}
function assignHost(g,h){if(!canOperate()||!hostReachable(goalHost(g))||hostEligibility(g,h))return false;const from=goalHost(g);g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=true;g.blocker=null;g.hostId=h.id;navigationEvent(g,'assignment',`从 ${from.name} 改派到 ${h.name}；保留检查点，等待明确继续。`);logOKR(g,`执行主机改为 ${h.name}；预算、权限及成功标准保持原约定。`);hostLog(from,'暂停该 OKR 的模拟执行并交接检查点。');hostLog(h,'接收 OKR 检查点，等待明确继续：'+g.name);return true;}
function hostSetConnection(h,online){if(!coordinatorFor(h)?.connected)return;const wasPending=h.status==='pending';h.status=online?(h.cpu>=90||h.mem>=90?'degraded':'online'):'offline';if(online&&wasPending){h.version='0.1.4 · 示例';h.uptime='刚刚上线 · 演示';}h.heartbeat=online?0:1320;if(online)h.lastSeen=new Date().toISOString();hostLog(h,online?'模拟连接恢复；请核对既有运行后继续。':'模拟心跳中断；运行结果保持未知。');for(const g of hostGoals(h)){g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=true;g.blocker=online?null:'执行主机 '+h.name+' 失联，结果待核对。';}if(desktopDemo.hostId===h.id)desktopDemo.control=false;}
function runHostCommand(h,command,instanceId,args){if(!hostReachable(h))return false;const mutating=['restart','kill','shell'].includes(command);if(mutating&&!canOperate())return false;if(!['status','logs','restart','kill','shell'].includes(command))return false;const instance=hostInstances(h).find(a=>a.id===instanceId);if(['logs','restart','kill'].includes(command)&&!instance)return false;let output='';if(command==='status')output=JSON.stringify({node:h.id,status:hostState(h),agents:hostInstances(h).map(a=>({id:a.id,status:a.status})),demo:true},null,2);if(command==='logs')output=`[demo] ${instance.id}\n[heartbeat] ${h.name} · sample received\n[workspace] ${h.workspace}\n[okr] ${hostGoals(h).filter(g=>g.owner===instance.role).map(g=>g.name).join(' / ')||'等待分配'}\n[info] 以上为模拟日志。`;if(command==='shell')output=`$ ${args}\n[demo] 请求已记录，未在任何真实主机执行。`;if(command==='restart'||command==='kill'){instance.status=command==='kill'?'stopped':'ready';output=`[demo] ${instance.id} ${command==='kill'?'已停止':'已重启'}。\n已有 OKR 检查点保留；需明确继续执行。`;for(const g of hostGoals(h).filter(g=>g.owner===instance.role)){g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=true;g.blocker=command==='kill'?'执行实例已停止。':null;}}
  if(command==='logs'&&args&&/^\d+$/.test(args))output=output.split('\n').slice(-Math.max(1,Math.min(1000,Number(args)))).join('\n');
  const at=new Date().toLocaleTimeString(preferences.locale,{hour12:false});h.commands.push({at,command,instanceId,output});h.commands=h.commands.slice(-40);hostLog(h,`命令 ${command} · ${instanceId||h.id} · 模拟回执已记录`);return true;}
function prepareHostCommand(h,command,instanceId,args=''){if(!hostReachable(h))return toast('主机不可达，未发起命令');if(['restart','kill','shell'].includes(command)){if(!canOperate())return toast(blockedMessage());pendingHostCommand={hostId:h.id,command,instanceId,args};openOverlay(`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('确认远程操作','核对目标主机与实例，本次为模拟执行。','shield')}<div class="detail-grid"><div><small>主机</small>${esc(h.name)}</div><div><small>命令</small>${esc(command)}</div><div><small>实例</small>${esc(instanceId||'主机级 Shell')}</div><div><small>参数</small>${esc(args||'—')}</div></div><div class="notice">${command==='kill'||command==='restart'?'将暂停该实例负责的 OKR 自主循环，保留已有结果。':'仅生成模拟回执，不执行系统命令。'}</div><div class="dialog-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-fleet="run-confirmed">确认演示操作</button></div></section>`);}else{runHostCommand(h,command,instanceId,args);hostTab='console';render();}}
function openFleetHost(id,tab='overview'){if(!hostById(id))return toast('主机记录不存在');selectedHost=id;hostTab=tab;desktopDemo.control=false;go('hosts');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-fleet]');if(!el||el.disabled)return;const action=el.dataset.fleet,id=el.dataset.id,h=hostById(id||selectedHost);switch(action){
case 'host':openFleetHost(id,el.dataset.tab||'overview');break;

case 'tab':hostTab=id;desktopDemo.control=false;render();break;

case 'host-connection':if(!canOperate())return toast(blockedMessage());hostSetConnection(h,!hostReachable(h));save();render();break;
case 'drain':if(!canOperate()||!hostReachable(h))return toast('主机当前不可操作');h.accepting=!h.accepting;hostLog(h,h.accepting?'恢复接收新 OKR。':'暂停接收新 OKR，当前运行保持原状。');save();render();break;
case 'assign':fleetAssign(state.goals.find(g=>g.id===id));break;

case 'prepare-command':prepareHostCommand(h,el.dataset.command,el.dataset.agent);break;

  const path=ps=>`M ${ps[0].x} ${ps[0].y} `+ps.slice(1).map((p,i)=>segment(ps[i],p)).join(' ');

function showNavigationEvidence(g){const n=navigation(g),a=navAssessment(g),k=currentKR(g);openOverlay(`<section class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('这次导航判断，从哪里来？',a.label+' · '+k.id.toUpperCase()+' · 路线 '+n.route,'target')}<div class="notice" style="margin:20px 0">${esc(a.reason)}<br>下一步：${esc(a.next)}</div><h3>判定规则与证据</h3><div class="okr-boundary"><small>位置</small><p>当前 ${k.id.toUpperCase()} / SIM-${g.id.toUpperCase()}-${String(n.seq).padStart(2,'0')}；测量 ${k.current} ${esc(k.unit)}，${krComplete(k)?'验证通过':'尚未独立验证'}。</p><small>偏航</small><p>示例规则：连续 2 次动作无法关联任何 KR，且缺少推进目标的证据。探索活动在已声明假设和探索额度内，不仅因短期指标不变就判为偏航。</p><small>空转</small><p>示例规则：观察窗内同输入、同错误和同策略连续 3 次，且无结果改善或新信息。正常等待窗口内不判为空转。</p><small>死胡同</small><p>必要条件被硬约束排除时，仅将当前路线标为不可行；替代路线仍需验证，不推断整个目标不可达。</p><small>边界检查</small><p data-i18n-content>${esc(g.scope)}；费用 $${g.spent.toFixed(2)} / $${g.budget}；期限 ${esc(g.deadline)}。失去观测时仅保留历史快照。</p></div><h3>执行记录 · 演示事件</h3>${n.events.length?n.events.slice().reverse().map(e=>`<div class="nav-event"><span class="badge">${esc(e.kind)}</span><div><p>${esc(e.message)}</p><small>${esc(e.at)} · ${esc(e.run)} · ${e.kr.toUpperCase()} · 路线 ${e.route} · 测量 ${e.value} ${esc(e.unit)}${e.hostId?' · '+esc(hostById(e.hostId)?.name||e.hostId)+' / '+esc(e.instanceId||''):' · 历史记录未标注主机'}</small></div></div>`).join(''):'<p class="muted" style="margin-top:15px">当前尚无新增运行记录。</p>'}<div class="dialog-footer"><button class="btn" data-action="kr-detail" data-id="${g.id}" data-kr="${k.id}">查看 KR 原始证据</button><button class="btn primary" data-action="close">返回导航</button></div></section>`);}
function injectNavigation(g,mode){
  if(!Object.hasOwn(navModes,mode)||g.lifecycle!=='ACTIVE')return;
  const n=navigation(g);if(mode==='unknown'&&n.mode!=='unknown')n.lastKnownMode=n.mode;g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=false;n.mode=mode;n.quote=mode==='budget'?Math.max(0,g.budget-g.spent)+1:null;if(mode==='blocked')n.route='A';
  if(mode==='drift'){for(let i=0;i<2;i++){n.seq++;navigationEvent(g,'deviation','界面重构动作未关联任何 KR；结果指标未改善（注入的演示事件）。');}}
  else if(mode==='loop'){for(let i=0;i<3;i++){n.seq++;navigationEvent(g,'stalled','同输入、同策略重试；指标未改善（注入的演示事件）。');}}
  else navigationEvent(g,mode==='blocked'||mode==='budget'?'blocked':'observation','注入演示场景：'+navModes[mode]);
  if(mode==='unknown')n.observedAt=Date.now()-22*60000;
  const a=navAssessment(g);g.blocker=['drift','loop','blocked','budget','unknown','approval'].includes(a.id)?a.reason:null;
  logOKR(g,'演示场景更新：'+navModes[mode]+'；已有指标与验证证据保留。');refreshOKR();toast('当前 OKR：'+navModes[mode]);
}
function replanNavigation(g){

  navigationEvent(g,'replan','放弃原策略；改用工作区内的独立分析与验证。预算、成功标准和权限未扩大。');logOKR(g,'Agent 重新规划路线 B，在当前授权内验证替代方案。');startAutonomy(g);

function heartbeat(g){
  if(g.lifecycle!=='ACTIVE')return false;
  const n=navigation(g),a=navAssessment(g);
  if(['unknown','drift','loop','blocked','waiting','agent-paused','host-scope'].includes(a.id)){if(a.id!=='unknown')navigationEvent(g,'blocked',a.reason);stopOKR(g,a.reason);return false;}
  const k=currentKR(g),beforeValue=k.current,beforeStatus=k.status,beforeLife=g.lifecycle,beforeTick=g.tick;n.seq++;
  const proceed=executeHeartbeat(g);
  if(g.tick!==beforeTick||g.lifecycle!==beforeLife){navigationEvent(g,g.lifecycle==='ACHIEVED'||k.status!==beforeStatus&&krComplete(k)?'verified':'measurement',g.lifecycle==='ACHIEVED'?'全部成功标准已验证，抵达 OKR 终点。':krComplete(k)?k.id.toUpperCase()+' 证据通过，解锁下游。':`${k.id.toUpperCase()} 测量 ${beforeValue} → ${k.current} ${k.unit}；等待独立验证。`,k);}
  else if(g.blocker)navigationEvent(g,'blocked',g.blocker,k);
  refreshOKR();return proceed;
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page],[data-filter],[data-detail-tab]');if(!el||el.disabled)return;
if(el.dataset.page){go(el.dataset.page);return;}if(el.dataset.filter){filter=el.dataset.filter;render();return;}if(el.dataset.detailTab){detailTab=el.dataset.detailTab;drawTask();return;}
const action=el.dataset.action,id=el.dataset.id;
const okr=state.goals.find(g=>g.id===id);

case 'nav-owner':showAgent(okr.owner);break;
case 'nav-replan':if(!canOperate())return toast(blockedMessage());replanNavigation(okr);break;

case 'nav-reconnect':if(mobileReadOnly())return toast(blockedMessage());if(state.offline)state.offline=false;navigation(okr).mode='live';okr.blocker=null;okr.manualPause=true;navigationEvent(okr,'reconciled','观测已恢复并对账；已有结果保留，没有重新提交旧操作。');refreshOKR();toast('观测已恢复，请确认后继续推进');break;

case 'okr-approve':if(!okr.request||okr.request.status==='approved')break;okr.request.status='approved';okr.blocker=null;logOKR(okr,'你仅授权此 KR 的真机验证，预算与截止日期保持约束。');closeOverlay();startAutonomy(okr);break;
case 'okr-deny':okr.request.status='rejected';okr.auto=false;okr.blocker='外部验证请求被拒绝，Agent 保留结果并暂停。';logOKR(okr,okr.blocker);closeOverlay();refreshOKR();break;
case 'okr-activate':if(okr.lifecycle!=='CANDIDATE')break;if(activeOKRs().length>=3)return toast('已有 3 个 ACTIVE OKR，请先完成其中一个');openOverlay(`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('确认并激活这个 OKR',esc(okr.name),'target')}<p style="margin:20px 0;font-size:12px" data-i18n-content>${esc(okr.criteria)}</p><div class="notice" data-i18n-content>${esc(okr.scope)} · $${okr.budget} 上限 · ${esc(okr.deadline)} 截止<br>Agent 按已确认的 KR 验证方式自动验收。</div><div class="dialog-footer"><button class="btn" data-action="close">返回</button><button class="btn primary" data-action="okr-confirm-active" data-id="${okr.id}">确认并授权推进</button></div></section>`);break;
case 'okr-confirm-active':if(!canOperate())return toast(blockedMessage());if(okr.lifecycle!=='CANDIDATE'||activeOKRs().length>=3)return toast('最多 3 个 ACTIVE OKR');okr.lifecycle='ACTIVE';watchedOKR=okr.id;go('home');startAutonomy(okr);break;
case 'add-kr':{const count=$('#kr-editors').children.length;if(count>=3)return toast('此原型最多支持 3 个 KR');$('#kr-editors').insertAdjacentHTML('beforeend',krEditor(count+1));break;}
case 'export-okr':exportOKRs();break;

case 'desktop':case 'mobile':document.body.classList.toggle('phone-mode',action==='mobile');$('#desktop-preview').classList.toggle('active',action==='desktop');$('#mobile-preview').classList.toggle('active',action==='mobile');render();if(activeTask&&$('#overlay .drawer'))drawTask();break;
case 'close':closeOverlay();break;
case 'reset':openOverlay(`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('重新体验这个原型','清除本次浏览器中的演示修改，恢复最初的目标、任务和审批。','refresh')}<div class="dialog-footer"><button class="btn" data-action="close">保留当前进度</button><button class="btn primary" data-action="confirm-reset">重置演示数据</button></div></section>`);break;
case 'confirm-reset':activeTimers.forEach(clearTimeout);activeTimers.clear();state=defaults();selectedHost='';hostTab='overview';fleetFilter='all';fleetStatusFilter='all';fleetQuery='';desktopDemo.control=false;selectedOKR=null;watchedOKR='app';okrFilter='all';page='home';filter='all';taskQuery='';closeOverlay();render();toast('已恢复初始演示，可以重新开始评审');break;
case 'new-goal':newGoal();break;
case 'goal':go('tasks',id);break;
case 'task':openTask(id);break;
case 'approve':{if(state.offline)return toast('设备离线，请先恢复连接');const t=taskChange('running','你批准了文件修改，演示执行已开始');toast('已批准本次操作，Agent 继续执行');if(t){later(()=>{if(t.status!=='running'||state.offline)return;t.status='review';t.history.push({text:'Agent 提交了演示成果，等待验收',icon:'file'});save();render();if(activeTask===t.id)drawTask();toast('演示执行完成，成果已提交待验收');},1800);}break;}
case 'reject':taskChange('blocked','你拒绝了本次操作，未执行文件修改');toast('已拒绝本次操作');break;
case 'finish-demo':if(!state.offline){taskChange('review','Agent 提交了演示成果，等待验收');toast('成果已提交，可以开始验收');}break;
case 'accept-task':if(!state.offline)acceptTask();break;
case 'save-memory':{const t=state.tasks.find(t=>t.id===activeTask);if(t)openMemoryDraft(t);break;}
case 'return-task':taskChange('running','你退回了成果，请 Agent 补充验证');toast('已退回补充，可在任务对话中说明要求');break;
case 'cancel-task':taskChange('cancelled','演示执行已确认停止，先前记录保留');toast('任务已停止，历史记录已保留');break;
case 'start-task':if(!state.offline){taskChange('running','你发起了新的执行尝试');toast('新的执行尝试已开始');}break;
case 'agent':showAgent(id);break;
case 'pause-agent':state.paused=state.paused.includes(id)?state.paused.filter(x=>x!==id):[...state.paused,id];save();render();showAgent(id);toast(state.paused.includes(id)?'Agent 已暂停接收新任务':'Agent 已恢复接收任务');break;
case 'agent-tasks':openSimple(agentFor(id).name+' 的执行计划','任务由 Agent 拆解，关联 OKR 与关键结果。',taskRows(state.tasks.filter(t=>t.agent===id)),'target');break;
case 'add-agent':openSimple('选择一种协作能力','Agent 连接器概念预览。默认伙伴已在当前演示空间准备好。',`<div style="margin-top:20px">${agents.map(a=>`<button class="choice-card" data-action="agent" data-id="${a.id}">${ava(a.id)}<span><strong>${a.name}</strong><small>${a.role} · 查看配置与权限</small></span>${icon('chevron')}</button>`).join('')}</div>`,'agents');break;
case 'memory':showMemory(id);break;
case 'spaces':showSpaces();break;
case 'select-personal':state.space='personal';go('home');toast('已回到个人空间');break;
case 'enter-org':state.space='labs';go('organizations');toast('已进入组织概念预览，个人项目保持私密');break;
case 'organization':showOrganization(id);break;
case 'org-interest':if(id==='labs'){state.space='labs';go('organizations');}else openSimple('参与 '+organizations.find(o=>o.id===id).name,'组织参与流程概念预览',`<div class="stack" style="margin-top:20px"><div class="notice">1. 阅读公开目标与成员规则</div><div class="notice">2. 选择希望参与的目标，提交个人贡献说明</div><div class="notice">3. 按组织规则确认成员身份与授权</div><p class="muted" style="font-size:11px">原型不会提交真实申请或链上交易。</p></div>`,'org');break;
case 'devices':selectedHost='';go('hosts');break;
case 'nav-host':openFleetHost(goalHost(okr)?.id);break;
case 'pair':showPair();break;
case 'pair-next':if(pairStep===0){pairStep=1;drawPair();}else if(pairStep===1){if(!$('#pair-read').checked){toast('请至少选择查看任务权限，或返回取消');return;}state.phoneAccess={read:true,operate:$('#pair-write').checked};state.phonePaired=true;save();render();pairStep=2;drawPair();}else{closeOverlay();render();toast('演示手机已配对并授权');}break;
case 'revoke':state.phonePaired=false;save();render();toast('已撤销演示手机的权限');break;
case 'notifications':{const blockers=state.goals.filter(g=>g.blocker),waiting=state.tasks.filter(t=>['approval','review'].includes(t.status));openSimple('需要你关注的进展','OKR 的异常与越界请求会在这里出现。',`<div style="margin-top:20px">${blockers.map(g=>`<button class="choice-card" data-action="watch-okr" data-id="${g.id}">${icon('shield')}<span class="grow"><strong data-i18n-content>${esc(g.name)}</strong><small>${esc(g.blocker)}</small></span>${icon('arrow')}</button>`).join('')}${waiting.map(t=>`<button class="choice-card" data-action="task" data-id="${t.id}">${icon(statusMap[t.status][2])}<span class="grow"><strong data-i18n-content>${esc(t.name)}</strong><small>${statusMap[t.status][0]}</small></span></button>`).join('')}${!blockers.length&&!waiting.length?'<div class="empty">暂时没有需要你介入的事项。</div>':''}</div>`,'bell');break;}
case 'search':openSearch();break;
case 'onboarding':onboarding();break;
case 'onboard-back':onboardStep--;drawOnboarding();break;
case 'onboard-next':if(onboardStep<2){onboardStep++;drawOnboarding();}else newGoal('让项目关键路径的测试通过率达到 100%');break;
case 'toggle-notifications':state.notifications=!state.notifications;save();render();toast(state.notifications?'演示通知已开启':'演示通知已关闭，待办仍会显示');break;
case 'toggle-background':state.background=!state.background;save();render();toast('后台执行偏好已更新（仅演示）');break;
case 'offline':state.goals.forEach(g=>{if(g.auto){g.auto=false;g.blocker='执行设备离线；恢复连接后重新确认推进。';}});state.offline=true;save();render();toast('已模拟设备离线，远程操作暂不可用');break;
case 'online':state.offline=false;save();render();toast('设备连接已恢复，演示状态已同步');break;
case 'export':exportData();break;
case 'diagnostic':openSimple('服务运行正常','以下为演示诊断，没有读取本机进程或系统信息。',`<div style="margin-top:16px">${['FractalMind Core','Agent Runtime','工作区索引','任务事件同步'].map(n=>`<div class="setting-row"><p>${n}</p><span class="badge green">${state.offline&&n==='任务事件同步'?'等待重连':'正常 · 演示'}</span></div>`).join('')}</div>`,'info');break;
case 'tool':openSimple(esc(id),'当前空间的能力与授权',`<div class="notice" style="margin-top:20px">执行设备：MacBook Pro<br>范围：个人空间 / fractalmind-os<br>模式：演示配置，无实际服务连接</div><p class="muted" style="font-size:12px;margin-top:20px">默认工具可以读取当前项目；按已确认的 OKR 范围执行项目操作，越界和公开发布需要具体授权。</p>`,'shield');break;
}
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const data=new FormData(form);
if(form.id==='new-okr-form'){if(!canOperate())return toast(blockedMessage());submitOKR(form,data);}
if(form.id==='okr-contract-form'){if(!canOperate())return toast(blockedMessage());const g=state.goals.find(g=>g.id===form.dataset.id);g.auto=false;g.manualPause=true;g.request=null;for(const key of ['scope','allowed','escalate','deadline'])g[key]=String(data.get(key)||'').trim();g.budget=Number(data.get('budget'));g.blocker=null;logOKR(g,'你更新并确认了执行约定；自主循环已暂停，重新推进时使用新边界。');closeOverlay();refreshOKR();toast('约定已更新，可以重新推进');}
if(form.id==='chat-form'){const msg=String(data.get('message')||'').trim();const t=state.tasks.find(t=>t.id===activeTask);if(!msg||!t)return;if(!canOperate())return toast(blockedMessage()+'；输入保留为草稿');t.messages.push('你：'+msg,'Agent · 演示回复：我已收到补充说明，会结合当前目标与验收条件继续处理。');t.history.push({text:'你补充了任务说明',icon:'message'});save();drawTask();toast('演示反馈已记录');}
if(form.id==='memory-form'){const t=state.tasks.find(t=>t.id===form.dataset.task);const title=String(data.get('title')||'').trim(),body=String(data.get('body')||'').trim();if(!title||!body)return;state.memories.unshift({id:'m'+Date.now(),title,body,type:'成果经验',source:t.name,date:'刚刚'});save();closeOverlay();page='memory';render();toast('记忆已保存，来源已关联到验收成果');}
if(form.id==='edit-memory-form'){const m=state.memories.find(m=>m.id===form.dataset.id);m.title=String(data.get('title')||'').trim();m.body=String(data.get('body')||'').trim();if(!m.title||!m.body)return;save();closeOverlay();render();toast('记忆已更新');}
});
document.addEventListener('change',e=>{if(e.target.id==='nav-okr-select'){watchedOKR=e.target.value;render();}if(e.target.dataset.navigationScenario){if(!canOperate()){render();return toast(blockedMessage());}const g=state.goals.find(g=>g.id===e.target.dataset.navigationScenario);if(g)injectNavigation(g,e.target.value);}});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){taskQuery=e.target.value;$('#task-results').innerHTML=taskRows(filteredTasks());}if(e.target.id==='global-search')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='org-search'){const q=e.target.value.toLowerCase();const found=organizations.filter(o=>(o.name+o.topic+' '+localizedText(o.name+o.topic)).toLowerCase().includes(q));$('#org-results').innerHTML=found.length?found.map(orgCard).join(''):'<div class="card empty" style="grid-column:1/-1">没有找到相关组织，请尝试其他名称。</div>';}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}if(e.key==='Escape')closeOverlay();if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]'))e.target.click();if(e.key==='Tab'&&$('#overlay').classList.contains('open')){const items=[...$('#overlay').querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
applyTheme();render();translateDOM();observePresentation();
</script>
</body>
</html>
