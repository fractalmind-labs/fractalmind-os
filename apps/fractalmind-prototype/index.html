function agentsPage(){return `${pageHeading('YOUR COLLABORATORS','一个目标，多种能力。','选择合适的伙伴，让协作自然发生。',`<button class="btn primary" data-action="add-agent">${icon('plus')}添加 Agent</button>`)}<div class="notice" style="margin-bottom:22px">${icon('info')}通过 OKR 对齐 Agent 的目标、成功标准与约束；Agent 自主拆解、执行和验证。</div><div class="agent-grid">${agents.map(a=>`<article class="card agent-card"><div class="agent-illustration ${a.color}"><span class="agent-symbol">${icon(a.symbol)}</span></div><div class="row between"><span class="badge ${state.paused.includes(a.id)?'':'green'}"><span class="dot ${state.paused.includes(a.id)?'gray':''}"></span>${state.paused.includes(a.id)?'已暂停':'就绪'}</span><span class="tag">${a.role}</span></div><h3>${a.name}</h3><p>${a.desc}</p><div class="divider"></div><div class="agent-spec"><span>模型</span><span>${a.model}</span></div><div class="agent-spec"><span>执行设备</span><span>MacBook Pro</span></div><div class="agent-spec"><span>进行中任务</span><span>${state.tasks.filter(t=>t.agent===a.id&&!['done','cancelled'].includes(t.status)).length} 项</span></div><button class="btn" data-action="agent" data-id="${a.id}">查看 Agent ${icon('arrow')}</button></article>`).join('')}</div><div class="card" style="margin-top:23px;background:#f3f6ed"><div class="row"><span class="avatar large">${icon('org')}</span><div class="grow"><h3>当一个人的目标，需要更多伙伴</h3><p class="muted" style="font-size:11px;margin-top:6px">在组织空间中，让 Lead 协调分工、交接与验收。</p></div><button class="link-btn" data-page="organizations">探索团队 ${icon('arrow')}</button></div></div>`;}
function memoryPage(){return `${pageHeading('MEMORY & OUTCOMES','让成果，成为下一次的起点。','保留有来源的经验，持续积累属于你的智能。',`<button class="btn" data-action="export">${icon('download')}导出记忆</button>`)}<div class="tabs"><button class="tab active">全部记忆 <span>${state.memories.length}</span></button><span class="spacer"></span><span class="badge">${icon('lock')}仅自己可见</span></div><div class="memory-grid">${state.memories.map(m=>`<button class="card memory-card clickable" data-action="memory" data-id="${m.id}"><span class="badge ${m.type==='产品决策'?'green':m.type==='设计原则'?'amber':'blue'}">${icon('book')}${m.type}</span><h3>${esc(m.title)}</h3><p>${esc(m.body.slice(0,80))}${m.body.length>80?'…':''}</p><footer><span>${esc(m.date)} · 有来源的记忆</span>${icon('arrow')}</footer></button>`).join('')}</div><div class="notice" style="margin-top:24px">${icon('leaf')}每次验收成果后，你都可以保存一条经验。内容保存在本地演示数据中，不会公开分享。</div>`;}
function governancePage(){const list=state.tasks.filter(t=>t.status==='approval'||t.status==='review');return `${pageHeading('GOVERNANCE','让自主协作，有清晰的边界。','你确认目标、验证方式与边界，Agent 在约定内自主推进。')}<div class="home-columns"><div><div class="section-head" style="margin-top:0"><h2>待处理决定 <span class="badge amber">${list.length+state.goals.filter(g=>g.blocker).length}</span></h2></div>${state.goals.filter(g=>g.blocker).map(g=>`<div class="decision-card"><span class="badge amber">OKR 需要介入</span><h3>${esc(g.name)}</h3><p>${esc(g.blocker)}</p><button class="btn" data-action="goal" data-id="${g.id}">查看并处理</button></div>`).join('')}${list.length?list.map(decision).join(''):state.goals.some(g=>g.blocker)?'':`<div class="card empty">${icon('checkCircle')}<h3>待办已处理完毕</h3><p>新的审批与验收会出现在这里。</p></div>`}<div class="section-head"><h2>决定记录</h2></div><div class="card timeline-card">${activityRows()}</div></div><div class="stack"><div class="card"><div class="row">${icon('shield')}<h3>个人空间的默认规则</h3></div><div class="setting-row"><div><p>读取当前工作区</p><small>仅限你选择的项目</small></div><span class="badge green">允许</span></div><div class="setting-row"><div><p>修改文件与执行命令</p><small>按 OKR 已确认范围自主执行</small></div><span class="badge green">约定内自主</span></div><div class="setting-row"><div><p>公开发布或跨空间访问</p><small>不继承当前项目授权</small></div><span class="badge">单独授权</span></div></div><div class="notice">${icon('lock')}配对建立连接，授权决定能做什么。你可以随时撤销设备权限。</div><button class="btn" data-action="devices">管理授权设备 ${icon('arrow')}</button></div></div>`;}
const organizations=[{id:'labs',name:'FractalMind Labs',short:'共同建设开放的 Agent 操作系统。',topic:'Agent 基础设施',members:12,mark:'△',color:'green',mission:'通过可组合的 Agent、团队与组织，让智能成为任何人都可以参与的公共基础设施。'},{id:'research',name:'Open Intelligence',short:'用公开研究，探索智能协作的边界。',topic:'开放研究',members:28,mark:'◎',color:'blue',mission:'共享研究方法、证据与结果，让更多人可以验证和延续智能协作研究。'},{id:'makers',name:'Independent Makers',short:'让个人创造力，连接更大的可能。',topic:'独立创造',members:36,mark:'✳',color:'amber',mission:'连接独立开发者与 Agent，通过真实项目和可复用技能共同成长。'}];

function settingsPage(){return `${pageHeading('SPACE SETTINGS','属于你的空间，由你掌控。','连接设备、管理工具，让工作以你习惯的方式发生。')}<div class="settings-grid"><div class="stack"><div class="card"><div class="row between"><h3>执行与协作设备</h3><button class="link-btn" data-action="pair">${icon('plus')}配对手机</button></div><div class="device-card"><span class="device-icon">${icon('laptop')}</span><div class="grow"><strong>MacBook Pro <span class="badge">本机</span></strong><small>macOS · Apple Silicon · 演示设备</small></div><span class="badge ${state.offline?'':'green'}">${state.offline?'离线':'在线'}</span></div>${state.phonePaired?`<div class="device-card"><span class="device-icon">${icon('phone')}</span><div class="grow"><strong>我的 iPhone <span class="badge green">已授权</span></strong><small>${state.phoneAccess?.operate?'查看任务 · 发起任务 · 操作审批':'查看任务与成果 · 只读'}</small></div><button class="btn small danger" data-action="revoke">撤销</button></div>`:`<div class="device-card"><span class="device-icon">${icon('phone')}</span><div class="grow"><strong>让手机接上你的工作</strong><small>离开电脑，也能查看结果和处理审批。</small></div></div>`}<div class="notice" style="font-size:10px;margin-top:14px">${icon('lock')}配对与授权分别确认。原型不会访问相机或创建真实凭据。</div></div><div class="card"><h3>模型与工具</h3>${[['spark','模型连接','Claude / GPT · 演示配置','已配置'],['folder','工作区访问','fractalmind-os · 仅当前项目','已授权'],['code','命令执行','遵守 OKR 范围与预算','约定内自主'],['book','内置技能','文件分析 · 代码检查 · 研究整理','3 项启用']].map(([ic,title,sub,label])=>`<div class="setting-row"><div class="row">${icon(ic)}<div><p>${title}</p><small>${sub}</small></div></div><button class="badge green" data-action="tool" data-id="${esc(title)}">${label}${icon('chevron')}</button></div>`).join('')}</div></div><div class="stack"><div class="card"><h3>工作偏好</h3><div class="setting-row"><div><p>需要决定时通知我</p><small>待审批、待验收和执行失败</small></div><button class="switch ${state.notifications?'on':''}" role="switch" aria-checked="${state.notifications}" aria-label="需要决定时通知我" data-action="toggle-notifications"></button></div><div class="setting-row"><div><p>关闭窗口后继续执行</p><small>保持本机核心服务运行</small></div><button class="switch ${state.background?'on':''}" role="switch" aria-checked="${state.background}" aria-label="关闭窗口后继续执行" data-action="toggle-background"></button></div></div><div class="card"><h3>数据与诊断</h3><p class="muted" style="font-size:11px;margin:10px 0 18px">工作区默认私密。演示修改仅保存在当前浏览器。</p><div class="stack" style="gap:9px"><button class="btn" data-action="export">${icon('download')}导出演示数据</button><button class="btn" data-action="diagnostic">${icon('info')}查看服务诊断</button><button class="btn" data-action="${state.offline?'online':'offline'}">${icon('wifi')}${state.offline?'恢复设备连接':'模拟设备离线'}</button></div></div><div class="notice">FractalMind · 产品原型 02 · OKR<br>所有操作均为本地交互演示，无真实执行。</div></div></div>`;}
function go(id){if(state.space==='labs'&&!['organizations','network'].includes(id))state.space='personal';page=id;closeOverlay();render();$('#content').scrollTop=0;}
function openOverlay(html,kind='dialog'){overlayReturn=document.activeElement;$('#overlay').classList.add('open');$('#overlay').innerHTML=`<div class="backdrop" data-action="close"></div>${kind==='drawer'?html:`<div class="dialog-wrap">${html}</div>`}`;requestAnimationFrame(()=>{const focus=$('#overlay input:not([type="checkbox"]),#overlay textarea,#overlay button');focus?.focus();});}
function closeOverlay(){const wasOpen=$('#overlay').classList.contains('open');$('#overlay').innerHTML='';$('#overlay').classList.remove('open');activeTask=null;if(wasOpen&&overlayReturn?.isConnected)overlayReturn.focus();}
function dialogHeader(title,desc,ico='spark'){return `<div class="row between"><span class="avatar">${icon(ico)}</span><button class="icon-btn" data-action="close" aria-label="关闭对话框">${icon('close')}</button></div><h2 id="dialog-title">${title}</h2><p>${desc}</p>`;}
function openTask(id,tab='overview'){const t=state.tasks.find(x=>x.id===id);if(!t)return;activeTask=id;detailTab=tab;drawTask();}
function drawTask(){const t=state.tasks.find(x=>x.id===activeTask);if(!t)return;const a=agentFor(t.agent);const html=`<section class="drawer" role="dialog" aria-modal="true" aria-labelledby="task-dialog-title"><div class="drawer-head"><div class="row">${badge(t.status)}<span class="mono muted">TASK / ${t.id.toUpperCase().slice(-8)}</span><span class="spacer"></span><button class="icon-btn" data-action="close" aria-label="关闭任务详情">${icon('close')}</button></div><h2 id="task-dialog-title">${esc(t.name)}</h2><div class="row" style="font-size:10px;color:#98a187">${icon('target')}${esc(state.goals.find(g=>g.id===t.goal)?.name||'个人目标')}</div><div class="tabs" role="tablist">${[['overview','任务概览'],['evidence','成果与证据'],['activity','活动记录']].map(([id,title])=>`<button class="tab ${detailTab===id?'active':''}" role="tab" aria-selected="${detailTab===id}" data-detail-tab="${id}">${title}</button>`).join('')}</div></div><div class="drawer-content">${mobileReadOnly()?'<div class="notice amber" style="margin-bottom:18px">此手机只有查看权限。审批和任务操作需要桌面授予相应权限。</div>':''}${detailTab==='activity'?taskActivity(t):`${detailTab==='overview'?`<div class="detail-grid"><div><small>责任 Agent</small><div class="row">${ava(a.id,'tiny')}${a.name} · ${a.role}</div></div><div><small>执行设备</small><div class="row">${icon('laptop')}MacBook Pro ${state.offline?'<span class="badge">离线</span>':'<span class="dot"></span>'}</div></div><div><small>空间与工作区</small><div class="row">${icon('lock')}个人空间 / fractalmind-os</div></div><div><small>交付状态</small><span>${t.status==='done'?'已验收并完成':t.status==='review'?'已提交，等待你的验收':'任务已指派，正在推进'}</span></div></div><h3>目标与验收条件</h3><p style="font-size:12px;color:#8b967d">${esc(t.detail)}</p>`:''}${taskActionBox(t)}${detailTab==='overview'?`<h3 style="margin-top:24px">继续对话</h3>${t.messages.map(m=>`<div class="chat-message">${esc(m)}</div>`).join('')}<form class="chat-input" id="chat-form"><textarea name="message" aria-label="任务补充说明" placeholder="补充背景，或给 Agent 新的反馈…" required maxlength="1000"></textarea><button class="btn primary" type="submit" aria-label="发送任务反馈">${icon('arrowUp')}</button></form>`:''}`}</div></section>`;openOverlay(html,'drawer');activeTask=t.id;}
function taskActionBox(t){if(t.status==='approval')return `<div class="approval-box"><div class="row">${icon('shield')}<h3 style="margin:0">这一步，需要你的确认</h3></div><p style="margin-top:11px">${agentFor(t.agent).name} 请求修改当前项目的 3 个文件，以完成目标中的界面调整。</p>${filesBox()}<div class="audit-note">作用域：当前工作区 · 仅本次操作<br>当前参数版本 v1 · 原型审批，无真实文件修改</div><div class="approval-actions"><button class="btn" data-action="reject" ${!canOperate()?'disabled':''}>拒绝</button><button class="btn primary" data-action="approve" ${!canOperate()?'disabled':''}>${icon('check')}批准并继续</button></div>${state.offline?'<p class="audit-note">设备离线，恢复连接后可处理审批。</p>':''}</div>`;
if(t.status==='review'||t.status==='done')return `<div class="evidence-card"><div class="row between"><h3 style="margin:0">${t.status==='done'?'成果已验收':'成果已提交，请你验收'}</h3><span class="badge green">演示成果</span></div><p class="muted" style="font-size:11px;margin:11px 0">${t.status==='done'?'验收记录已与任务证据关联，可在记忆中继续积累经验。':'Agent 已完成这次执行。请检查交付内容是否满足你的验收条件。'}</p>${filesBox()}<div class="diff">+ 统一空间与任务上下文<br>+ 增加设备和权限状态提示<br>+ 支持桌面与手机的响应式布局</div><div class="evidence-line">${icon('checkCircle')}演示检查：界面结构与核心流程已覆盖</div><div class="evidence-line">${icon('file')}交付说明与操作记录已关联</div>${t.status==='review'?`<div class="approval-actions"><button class="btn" data-action="return-task" ${!canOperate()?'disabled':''}>退回补充</button><button class="btn primary" data-action="accept-task" ${!canOperate()?'disabled':''}>${icon('check')}验收通过</button></div>`:`<button class="btn soft" style="margin-top:9px" data-action="save-memory">${icon('book')}沉淀为记忆</button>`}</div>`;

function krProgress(k){return Math.max(0,Math.min(100,(k.current-k.baseline)/(k.target-k.baseline)*100));}

function krComplete(k){return metricMet(k)&&k.verified&&k.evidence.some(e=>e.valid);}
function okrProgress(g){const total=g.krs.reduce((n,k)=>n+k.weight,0);return Math.round(g.krs.reduce((n,k)=>n+krProgress(k)*k.weight,0)/total);}

function stopOKR(g,reason){g.auto=false;g.blocker=reason;logOKR(g,reason);refreshOKR();}
function heartbeat(g){
  if(g.lifecycle!=='ACTIVE')return false;
  if(state.offline){stopOKR(g,'执行设备离线；恢复连接后重新确认推进。');return false;}
  if(state.paused.includes(g.owner)){stopOKR(g,'责任 Agent 已暂停；恢复 Agent 后继续。');return false;}
  if(g.deadline<new Date().toISOString().slice(0,10)){stopOKR(g,'已到达截止日期；请复盘并调整约定。');return false;}
  if(g.request&&g.request.status!=='approved'){stopOKR(g,'真机性能验证需要外部测试服务，等待你的单次授权。');return false;}
  if(g.krs.every(krComplete)){g.lifecycle='ACHIEVED';g.auto=false;g.blocker=null;logOKR(g,'预授权验证器复核全部成功标准：通过。OKR 已达成，移入成果记录。');refreshOKR();toast('OKR 已达成，完整证据已保留');return false;}
  const k=g.krs.find(k=>!krComplete(k)&&k.depends.every(id=>krComplete(g.krs.find(x=>x.id===id))));
  if(!k){stopOKR(g,'前置 KR 尚未验证；检查依赖与验证结果。');return false;}
  if(g.id==='app'&&k.id==='kr3'&&!g.request){g.request={status:'pending',scope:'仅提交匿名交互计时样本到演示真机测试服务',cost:3,kr:k.id};stopOKR(g,'KR3 需要工作区外的真机测试服务；Agent 已暂停这一步并提交授权请求。');return false;}
  const cost=g.id==='app'&&k.id==='kr3'?3:1.5;
  if(g.spent+cost>g.budget){stopOKR(g,`下一步预计 $${cost.toFixed(2)}，剩余 $${(g.budget-g.spent).toFixed(2)}。预算不足，等待调整。`);return false;}
  g.blocker=null;g.tick++;g.spent=Math.round((g.spent+cost)*100)/100;k.status='IN PROGRESS';
  const now=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  if(metricMet(k)){k.verified=true;k.status='COMPLETE';k.evidence.push({at:now,value:k.current,text:k.verification,verifier:'预授权验证器 · 演示',valid:true});logOKR(g,`${k.id.toUpperCase()} 证据验证通过；检查下游依赖并自主安排下一步。`);state.tasks.filter(t=>t.goal===g.id&&t.kr===k.id).forEach(t=>{t.status='done';t.history.push({text:'预授权验证器检查 KR 证据通过，执行任务归档（演示）',icon:'checkCircle'});});}
  else{const step=Math.abs(k.target-k.baseline)/3,dir=Math.sign(k.target-k.baseline);const value=k.current+dir*step;k.current=Math.round((dir>0?Math.min(k.target,value):Math.max(k.target,value))*100)/100;k.verified=false;k.updated=now;k.evidence.push({at:now,value:k.current,text:`${k.deliverable}：本轮测量 ${k.current} ${k.unit}；${metricMet(k)?'达到阈值，下一轮复核证据':'继续调整执行计划'}`,verifier:agentFor(g.owner).name+' · 演示采样',valid:false});logOKR(g,`${k.id.toUpperCase()} 自主推进：实测 ${k.current} ${k.unit}，${metricMet(k)?'等待证据验证':'更新计划并继续执行'}。`);let t=state.tasks.find(t=>t.goal===g.id&&t.kr===k.id&&t.status!=='done');if(!t){t={id:'t'+Date.now(),goal:g.id,kr:k.id,name:'采集并验证「'+k.title+'」的结果',agent:g.owner,status:'running',detail:k.verification,history:[],messages:[]};state.tasks.push(t);}t.status='running';}
  g.series.push({label:now.slice(0,5),value:okrProgress(g)});refreshOKR();return true;
}
function queueHeartbeat(g){const epoch=g.autoEpoch;later(()=>{if(!g.auto||g.autoEpoch!==epoch)return;if(heartbeat(g)&&g.auto)queueHeartbeat(g);},2200);}

ATE" ${activeOKRs().length>=3?'selected':''}>保存候选，暂不执行 · CANDIDATE</option></select><small>当前 ${activeOKRs().length}/3 个 ACTIVE；达到上限后进入候选池。</small></label><div class="dialog-footer"><button class="btn" type="button" data-action="close">取消</button><button class="btn primary" type="submit">确认并保存 OKR</button></div></form></section>`);}
function submitOKR(form,data){

  logOKR(g,lifecycle==='ACTIVE'?'你确认了 OKR、验证方式与边界，授权自主推进。':'OKR 已进入候选池，等待激活。');state.goals.unshift(g);selectedOKR=g.id;okrFilter='all';closeOverlay();page='tasks';refreshOKR();if(lifecycle==='ACTIVE')startAutonomy(g);toast(lifecycle==='ACTIVE'?'OKR 已确认，开始演示自主推进':'候选 OKR 已保存');
}
function exportOKRs(){const list=activeOKRs();const body='# OKR\n\n> FractalMind 产品原型导出；全部指标、证据与授权为演示。\n\n'+list.map(g=>`### OKR ${g.name} — ACTIVE ${g.priority}\n\n**Owner**: ${agentFor(g.owner).name}\n\n**Deadline**: ${g.deadline}\n\n#### Objective\n${g.name}\n\n#### Success Criteria\n${g.criteria}\n\n#### Key Results\n${g.krs.map(k=>`\n**${k.id.toUpperCase()}: ${k.title}** — ${k.status}\n- Deliverable: ${k.deliverable}\n- Depends on: ${k.depends.join(', ')||'None'}\n- Outcome: ${k.baseline} → ${k.current} / ${k.target} ${k.unit}\n- Verification: ${k.verification}\n- Weight: ${k.weight}\n- Evidence (demo): ${k.evidence.map(e=>e.text).join('; ')||'None'}\n`).join('')}\n#### Execution Constraints\n- Scope: ${g.scope}\n- Allowed: ${g.allowed}\n- Escalate: ${g.escalate}\n- Budget: USD ${g.spent}/${g.budget}\n\n#### Tasks / Milestones\n${state.tasks.filter(t=>t.goal===g.id).map(t=>`- [${t.status==='done'?'x':' '}] ${t.name} — ${t.kr?.toUpperCase()} / ${agentFor(t.agent).name}`).join('\n')}\n`).join('\n---\n\n');const url=URL.createObjectURL(new Blob([body],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='OKR.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 ACTIVE OKR；候选与已达成记录保留在完整数据导出中');}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page],[data-filter],[data-detail-tab]');if(!el||el.disabled)return;
if(el.dataset.page){go(el.dataset.page);return;}if(el.dataset.filter){filter=el.dataset.filter;render();return;}if(el.dataset.detailTab){detailTab=el.dataset.detailTab;drawTask();return;}
const action=el.dataset.action,id=el.dataset.id;
const okr=state.goals.find(g=>g.id===id);
if(['okr-auto','okr-tick','okr-activate','okr-approve','okr-deny'].includes(action)&&!canOperate())return toast(blockedMessage());
if(['new-goal','approve','reject','finish-demo','accept-task','return-task','cancel-task','start-task','pause-agent'].includes(action)&&!canOperate()){toast(blockedMessage());return;}
switch(action){
case 'okr-history':openSimple('自主推进记录','每次状态变化均保留原因与时间。',`<div class="okr-audit">${okr.audit.slice().reverse().map(a=>`<div><span class="dot"></span><p>${esc(a.text)}<small>${esc(a.at)}</small></p></div>`).join('')}</div>`,'clock');break;
case 'okr-filter':okrFilter=id;render();break;
case 'kr-detail':showKR(id,el.dataset.kr);break;
case 'okr-calculation':openSimple('进度来自结果指标','每个 KR 先计算相对基线的达成度，再按权重汇总。',`<div class="notice" style="margin:20px 0">提升型与降低型通用公式：<br>（当前值 − 基线）÷（目标值 − 基线）<br>每个 KR 限定在 0%–100%；整体按权重加权平均。</div><p style="font-size:12px">当前 ${okrProgress(okr)}%。任务数量不参与计算。100% 只表示指标达标；证据验证及成功标准复核通过后，OKR 才是 ACHIEVED。</p>`,'target');break;
case 'okr-contract':showContract(okr);break;
case 'okr-request':requestBoundary(okr);break;
case 'okr-auto':if(okr.auto){okr.auto=false;okr.manualPause=true;logOKR(okr,'你暂停了自主推进；已有结果和证据保留。');refreshOKR();}else startAutonomy(okr);break;
case 'okr-tick':heartbeat(okr);break;
case 'okr-approve':if(!okr.request||okr.request.status==='approved')break;okr.request.status='approved';okr.blocker=null;logOKR(okr,'你仅授权此 KR 的真机验证，预算与截止日期保持约束。');closeOverlay();startAutonomy(okr);break;
case 'okr-deny':okr.request.status='rejected';okr.auto=false;okr.blocker='外部验证请求被拒绝，Agent 保留结果并暂停。';logOKR(okr,okr.blocker);closeOverlay();refreshOKR();break;
case 'okr-activate':if(okr.lifecycle!=='CANDIDATE')break;if(activeOKRs().length>=3)return toast('已有 3 个 ACTIVE OKR，请先完成其中一个');openOverlay(`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('确认并激活这个 OKR',esc(okr.name),'target')}<p style="margin:20px 0;font-size:12px">${esc(okr.criteria)}</p><div class="notice">${esc(okr.scope)} · $${okr.budget} 上限 · ${esc(okr.deadline)} 截止<br>Agent 按已确认的 KR 验证方式自动验收。</div><div class="dialog-footer"><button class="btn" data-action="close">返回</button><button class="btn primary" data-action="okr-confirm-active" data-id="${okr.id}">确认并授权推进</button></div></section>`);break;
case 'okr-confirm-active':if(!canOperate())return toast(blockedMessage());if(okr.lifecycle!=='CANDIDATE'||activeOKRs().length>=3)return toast('最多 3 个 ACTIVE OKR');okr.lifecycle='ACTIVE';selectedOKR=okr.id;okrFilter='all';closeOverlay();startAutonomy(okr);break;
case 'add-kr':{const count=$('#kr-editors').children.length;if(count>=3)return toast('此原型最多支持 3 个 KR');$('#kr-editors').insertAdjacentHTML('beforeend',krEditor(count+1));break;}
case 'export-okr':exportOKRs();break;

case 'desktop':case 'mobile':document.body.classList.toggle('phone-mode',action==='mobile');$('#desktop-preview').classList.toggle('active',action==='desktop');$('#mobile-preview').classList.toggle('active',action==='mobile');render();if(activeTask&&$('#overlay .drawer'))drawTask();break;
case 'close':closeOverlay();break;
case 'reset':openOverlay(`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('重新体验这个原型','清除本次浏览器中的演示修改，恢复最初的目标、任务和审批。','refresh')}<div class="dialog-footer"><button class="btn" data-action="close">保留当前进度</button><button class="btn primary" data-action="confirm-reset">重置演示数据</button></div></section>`);break;
case 'confirm-reset':activeTimers.forEach(clearTimeout);activeTimers.clear();state=defaults();selectedOKR='app';okrFilter='all';page='tasks';filter='all';taskQuery='';closeOverlay();render();toast('已恢复初始演示，可以重新开始评审');break;
case 'new-goal':newGoal();break;
case 'goal':selectedOKR=id;okrFilter='all';go('tasks');break;
case 'task':openTask(id);break;
case 'approve':{if(state.offline)return toast('设备离线，请先恢复连接');const t=taskChange('running','你批准了文件修改，演示执行已开始');toast('已批准本次操作，Agent 继续执行');if(t){later(()=>{if(t.status!=='running'||state.offline)return;t.status='review';t.history.push({text:'Agent 提交了演示成果，等待验收',icon:'file'});save();render();if(activeTask===t.id)drawTask();toast('演示执行完成，成果已提交待验收');},1800);}break;}
case 'reject':taskChange('blocked','你拒绝了本次操作，未执行文件修改');toast('已拒绝本次操作');break;
case 'finish-demo':if(!state.offline){taskChange('review','Agent 提交了演示成果，等待验收');toast('成果已提交，可以开始验收');}break;
case 'accept-task':if(!state.offline)acceptTask();break;
case 'save-memory':{const t=state.tasks.find(t=>t.id===activeTask);if(t)openMemoryDraft(t);break;}
case 'return-task':taskChange('running','你退回了成果，请 Agent 补充验证');toast('已退回补充，可在任务对话中说明要求');break;
case 'cancel-task':taskChange('cancelled','演示执行已确认停止，先前记录保留');toast('任务已停止，历史记录已保留');break;
case 'start-task':if(!state.offline){taskChange('running','你发起了新的执行尝试');toast('新的执行尝试已开始');}break;
case 'agent':showAgent(id);break;
case 'pause-agent':state.paused=state.paused.includes(id)?state.paused.filter(x=>x!==id):[...state.paused,id];save();render();showAgent(id);toast(state.paused.includes(id)?'Agent 已暂停接收新任务':'Agent 已恢复接收任务');break;
case 'agent-tasks':openSimple(agentFor(id).name+' 的执行计划','任务由 Agent 拆解，关联 OKR 与关键结果。',taskRows(state.tasks.filter(t=>t.agent===id)),'target');break;
case 'add-agent':openSimple('选择一种协作能力','Agent 连接器概念预览。默认伙伴已在当前演示空间准备好。',`<div style="margin-top:20px">${agents.map(a=>`<button class="choice-card" data-action="agent" data-id="${a.id}">${ava(a.id)}<span><strong>${a.name}</strong><small>${a.role} · 查看配置与权限</small></span>${icon('chevron')}</button>`).join('')}</div>`,'agents');break;
case 'memory':showMemory(id);break;
case 'spaces':showSpaces();break;
case 'select-personal':state.space='personal';go('home');toast('已回到个人空间');break;
case 'enter-org':state.space='labs';go('organizations');toast('已进入组织概念预览，个人项目保持私密');break;
case 'organization':showOrganization(id);break;
case 'org-interest':if(id==='labs'){state.space='labs';go('organizations');}else openSimple('参与 '+organizations.find(o=>o.id===id).name,'组织参与流程概念预览',`<div class="stack" style="margin-top:20px"><div class="notice">1. 阅读公开目标与成员规则</div><div class="notice">2. 选择希望参与的目标，提交个人贡献说明</div><div class="notice">3. 按组织规则确认成员身份与授权</div><p class="muted" style="font-size:11px">原型不会提交真实申请或链上交易。</p></div>`,'org');break;
case 'devices':go('settings');break;
case 'pair':showPair();break;
case 'pair-next':if(pairStep===0){pairStep=1;drawPair();}else if(pairStep===1){if(!$('#pair-read').checked){toast('请至少选择查看任务权限，或返回取消');return;}state.phoneAccess={read:true,operate:$('#pair-write').checked};state.phonePaired=true;save();render();pairStep=2;drawPair();}else{closeOverlay();render();toast('演示手机已配对并授权');}break;
case 'revoke':state.phonePaired=false;save();render();toast('已撤销演示手机的权限');break;
case 'notifications':{const blockers=state.goals.filter(g=>g.blocker),waiting=state.tasks.filter(t=>['approval','review'].includes(t.status));openSimple('需要你关注的进展','OKR 的异常与越界请求会在这里出现。',`<div style="margin-top:20px">${blockers.map(g=>`<button class="choice-card" data-action="goal" data-id="${g.id}">${icon('shield')}<span class="grow"><strong>${esc(g.name)}</strong><small>${esc(g.blocker)}</small></span>${icon('arrow')}</button>`).join('')}${waiting.map(t=>`<button class="choice-card" data-action="task" data-id="${t.id}">${icon(statusMap[t.status][2])}<span class="grow"><strong>${esc(t.name)}</strong><small>${statusMap[t.status][0]}</small></span></button>`).join('')}${!blockers.length&&!waiting.length?'<div class="empty">暂时没有需要你介入的事项。</div>':''}</div>`,'bell');break;}
case 'search':openSearch();break;
case 'onboarding':onboarding();break;
case 'onboard-back':onboardStep--;drawOnboarding();break;
case 'onboard-next':if(onboardStep<2){onboardStep++;drawOnboarding();}else newGoal('让项目关键路径的测试通过率达到 100%');break;
case 'toggle-notifications':state.notifications=!state.notifications;save();render();toast(state.notifications?'演示通知已开启':'演示通知已关闭，待办仍会显示');break;
case 'toggle-background':state.background=!state.background;save();render();toast('后台执行偏好已更新（仅演示）');break;
case 'offline':state.goals.forEach(g=>{if(g.auto){g.auto=false;g.blocker='执行设备离线；恢复连接后重新确认推进。';}});state.offline=true;save();render();toast('已模拟设备离线，远程操作暂不可用');break;
case 'online':state.offline=false;save();render();toast('设备连接已恢复，演示状态已同步');break;
case 'export':exportData();break;
case 'diagnostic':openSimple('服务运行正常','以下为演示诊断，没有读取本机进程或系统信息。',`<div style="margin-top:16px">${['FractalMind Core','Agent Runtime','工作区索引','任务事件同步'].map(n=>`<div class="setting-row"><p>${n}</p><span class="badge green">${state.offline&&n==='任务事件同步'?'等待重连':'正常 · 演示'}</span></div>`).join('')}</div>`,'info');break;
case 'tool':openSimple(esc(id),'当前空间的能力与授权',`<div class="notice" style="margin-top:20px">执行设备：MacBook Pro<br>范围：个人空间 / fractalmind-os<br>模式：演示配置，无实际服务连接</div><p class="muted" style="font-size:12px;margin-top:20px">默认工具可以读取当前项目；按已确认的 OKR 范围执行项目操作，越界和公开发布需要具体授权。</p>`,'shield');break;
}
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const data=new FormData(form);
if(form.id==='new-okr-form'){if(!canOperate())return toast(blockedMessage());submitOKR(form,data);}
if(form.id==='okr-contract-form'){if(!canOperate())return toast(blockedMessage());const g=state.goals.find(g=>g.id===form.dataset.id);g.auto=false;g.manualPause=true;g.request=null;for(const key of ['scope','allowed','escalate','deadline'])g[key]=String(data.get(key)||'').trim();g.budget=Number(data.get('budget'));g.blocker=null;logOKR(g,'你更新并确认了执行约定；自主循环已暂停，重新推进时使用新边界。');closeOverlay();refreshOKR();toast('约定已更新，可以重新推进');}
if(form.id==='chat-form'){const msg=String(data.get('message')||'').trim();const t=state.tasks.find(t=>t.id===activeTask);if(!msg||!t)return;if(!canOperate())return toast(blockedMessage()+'；输入保留为草稿');t.messages.push('你：'+msg,'Agent · 演示回复：我已收到补充说明，会结合当前目标与验收条件继续处理。');t.history.push({text:'你补充了任务说明',icon:'message'});save();drawTask();toast('演示反馈已记录');}
if(form.id==='memory-form'){const t=state.tasks.find(t=>t.id===form.dataset.task);const title=String(data.get('title')||'').trim(),body=String(data.get('body')||'').trim();if(!title||!body)return;state.memories.unshift({id:'m'+Date.now(),title,body,type:'成果经验',source:t.name,date:'刚刚'});save();closeOverlay();page='memory';render();toast('记忆已保存，来源已关联到验收成果');}
if(form.id==='edit-memory-form'){const m=state.memories.find(m=>m.id===form.dataset.id);m.title=String(data.get('title')||'').trim();m.body=String(data.get('body')||'').trim();if(!m.title||!m.body)return;save();closeOverlay();render();toast('记忆已更新');}
});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){taskQuery=e.target.value;$('#task-results').innerHTML=taskRows(filteredTasks());}if(e.target.id==='global-search')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='org-search'){const q=e.target.value.toLowerCase();const found=organizations.filter(o=>(o.name+o.topic).toLowerCase().includes(q));$('#org-results').innerHTML=found.length?found.map(orgCard).join(''):'<div class="card empty" style="grid-column:1/-1">没有找到相关组织，请尝试其他名称。</div>';}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}if(e.key==='Escape')closeOverlay();if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]'))e.target.click();if(e.key==='Tab'&&$('#overlay').classList.contains('open')){const items=[...$('#overlay').querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
render();
</script>
</body>
</html>
