.presentation-controls{display:flex;align-items:center;gap:7px;margin-right:7px}.presentation-picker{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:var(--panel);color:var(--muted)}.presentation-picker .icon{width:14px;height:14px}.presentation-picker select{border:0;background:transparent;color:var(--ink);font-size:11px;min-height:22px;max-width:110px;cursor:pointer}.presentation-picker option{background:var(--panel);color:var(--ink)}.theme-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.theme-choice{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 5px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:11px;color:var(--muted)}.theme-choice[aria-pressed=true]{border-color:var(--green);background:var(--soft);color:var(--ink)}.theme-choice .icon{width:21px;height:21px}.appearance-card select{color:var(--ink);background:var(--panel)}

const localeWords=Object.keys(EN).sort((a,b)=>b.length-a.length);
const localePattern=new RegExp(localeWords.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const seededText=new Set();
function collectSeedText(value){if(typeof value==='string')seededText.add(value);else if(Array.isArray(value))value.forEach(collectSeedText);else if(value&&typeof value==='object')Object.values(value).forEach(collectSeedText);}
collectSeedText(defaults());
function translateText(source){
  if(preferences.locale!=='en')return source;
  // Exact messages first; fragments cover labels composed with dynamic metrics or agent names.
  const trimmed=source.trim();if(Object.hasOwn(EN,trimmed))return source.replace(trimmed,EN[trimmed]);
  const translated=source.replace(localePattern,key=>' '+EN[key]+' ').replace(/[ \t]{2,}/g,' ').replace(/，/g,', ').replace(/。/g,'. ').replace(/：/g,': ').replace(/；/g,'; ').replace(/（/g,' (').replace(/）/g,') ').replace(/、/g,', ');
  return /[\u3400-\u9fff]/.test(translated.replaceAll('简体中文',''))?source:translated;
}
function localizedText(source){return translateText(String(source??''));}
function applyTheme(){
  const dark=preferences.theme==='dark'||preferences.theme==='system'&&systemTheme.matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.documentElement.style.colorScheme=dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]').content=dark?'#151d1b':'#fafbf8';
  document.querySelectorAll('[data-theme-choice]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.themeChoice===preferences.theme)));
}
function translateDOM(root=document.body){
  const blocked=el=>el.closest('script,style,[translate="no"],.terminal-window,.host-terminal');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
  while(node=walker.nextNode()){
    if(!node.parentElement||blocked(node.parentElement)||node.parentElement.closest('textarea'))continue;
    const previous=textSources.get(node);
    const source=previous&&node.nodeValue===previous.rendered?previous.source:node.nodeValue;
    // Authored objective names, notes and agreements retain their original language.
    if(node.parentElement.closest('[data-i18n-content]')&&!seededText.has(source.trim()))continue;
    const rendered=translateText(source);if(node.nodeValue!==rendered)node.nodeValue=rendered;
    textSources.set(node,{source,rendered});
  }
  for(const el of [...(root.matches?.('[aria-label],[title],[placeholder]')?[root]:[]),...root.querySelectorAll('[aria-label],[title],[placeholder]')]){
    if(blocked(el))continue;
    const saved=attributeSources.get(el)||{};
    for(const key of ['aria-label','title','placeholder']){
      if(!el.hasAttribute(key))continue;
      const current=el.getAttribute(key),prior=saved[key],source=prior&&current===prior.rendered?prior.source:current;
      const rendered=translateText(source);if(rendered!==current)el.setAttribute(key,rendered);saved[key]={source,rendered};
    }
    attributeSources.set(el,saved);
  }
  document.documentElement.lang=preferences.locale;
  document.title=preferences.locale==='en'?'FractalMind — Intelligence grows together':'FractalMind — 你的智能，从这里生长';
  document.querySelectorAll('[data-locale-picker]').forEach(el=>{el.value=preferences.locale;});
  document.querySelectorAll('[data-theme-picker]').forEach(el=>{el.value=preferences.theme;});
}
function updatePreference(key,value){
  const allowed=key==='locale'?['zh-CN','en']:['light','dark','system'];if(!allowed.includes(value))return;
  preferences[key]=value;try{localStorage.setItem(UI_KEY,JSON.stringify(preferences));}catch{}
  applyTheme();translateDOM();

const presentationObserver=new MutationObserver(records=>{

  const roots=new Set();for(const record of records){const el=record.target.nodeType===Node.ELEMENT_NODE?record.target:record.target.parentElement;if(el&&!el.closest('script,style'))roots.add(el);}
  for(const root of roots)translateDOM(root);
  presentationObserver.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
});

function membershipFor(h){return h&&chainDemo().memberships.find(m=>m.orgId===h.orgId&&m.hostId===h.id&&m.device===h.device);}

}
function enrollmentCanAct(r){return !!r&&r.orgId===state.orgId&&!mobileReadOnly()&&identityAllowed('manage');}
function enrollmentAdmin(r){return enrollmentCanAct(r)&&currentOrg().role==='admin';}
function beginEnrollmentTx(r,kind,options={}){
  if(!enrollmentCanAct(r)||!chainDemo().rpc||r.tx)return false;
  if(kind==='request'&&r.status!=='draft')return false;
  if(['approve','reject','grant','revoke'].includes(kind)&&!enrollmentAdmin(r))return false;
  if(kind==='request'&&!r.consent)return false;
  if(['request','approve','reject'].includes(kind)&&r.expires<=Date.now()){r.status='expired';return false;}
  if(['approve','reject'].includes(kind)&&r.status!=='requested')return false;
  if(kind==='approve'&&options.fingerprint!==r.device)return false;
  if(kind==='grant'&&(r.status!=='member'||membershipFor(hostById(r.hostId))?.status!=='confirmed'))return false;
  if(kind==='grant'&&(!options.execute||!r.consent))return false;
  if(kind==='revoke'&&!['member','authorized','connected'].includes(r.status))return false;
  const tx={id:demoId('TX'),orgId:r.orgId,requestId:r.id,kind,status:'pending',options:{...options}};
  chainDemo().transactions.push(tx);r.tx=tx.id;save();return true;
}
function settleEnrollmentTx(r,success){
  const ledger=chainDemo(),tx=ledger.transactions.find(t=>t.id===r?.tx);
  if(!enrollmentCanAct(r)||!ledger.rpc||!tx||tx.status!=='pending')return false;
  if(!success){tx.status='failed';r.tx=null;save();return true;}
  if(['approve','reject','grant','revoke'].includes(tx.kind)&&!enrollmentAdmin(r))return false;
  if(['request','approve','reject'].includes(tx.kind)&&r.expires<=Date.now()){tx.status='failed';r.status='expired';r.tx=null;save();return false;}
  if(tx.kind==='request')r.status='requested';
  if(tx.kind==='reject')r.status='rejected';
  if(tx.kind==='approve'){
    if(r.status!=='requested'||tx.options.fingerprint!==r.device)return false;
    r.hostId=r.id.replace('JOIN','HOST');r.status='member';
    ledger.memberships.push({id:demoId('MEMBER'),orgId:r.orgId,hostId:r.hostId,device:r.device,status:'confirmed'});
    state.fleet.hosts.push({id:r.hostId,orgId:r.orgId,device:r.device,authorityMigrated:true,name:r.name,kind:r.kind,coordinator:r.coordinator,location:r.location,os:r.os,status:'pending',cpu:0,mem:0,ram:16,disk:256,desktop:r.desktop,accepting:true,workspace:r.scope,lastSeen:new Date().toISOString(),heartbeat:null,uptime:'尚未上线',version:'待确认',commands:[],audit:[]});
  }
  if(tx.kind==='grant'){
    if(r.status!=='member'||membershipFor(hostById(r.hostId))?.status!=='confirmed')return false;
    ledger.grants.push({id:demoId('GRANT'),orgId:r.orgId,hostId:r.hostId,status:'confirmed',scope:r.scope,execute:true,desktop:r.desktop&&!!tx.options.desktop,expires:Date.now()+7*86400000});r.status='authorized';
  }
  if(tx.kind==='revoke'){
    const h=hostById(r.hostId),m=membershipFor(h),g=grantFor(h);if(m)m.status='revoked';if(g)g.status='revoked';r.status='revoked';
    for(const goal of hostGoals(h)){goal.auto=false;goal.manualPause=true;goal.autoEpoch=(goal.autoEpoch||0)+1;goal.blocker='主机组织资格已撤销，新的执行已拦截';}
    desktopDemo.control=false;
  }
  tx.status='confirmed';r.tx=null;save();return true;
}

// One-use invitations model prior administrator approval. Secrets stay in review-session memory.
let inviteSecrets=new Map(),inviteView={mode:'create',id:null,code:'',error:'',busy:false,result:null};
function invitations(){return chainDemo().invites??=([]);}
function inviteById(id){return invitations().find(i=>i.id===id);}
function orgInvitations(){return invitations().filter(i=>i.orgId===state.orgId);}
function invitationState(i){return i.status==='active'&&i.expires<=Date.now()?'expired':i.status;}
function inviteBytes(text){return new TextEncoder().encode(text);}
function inviteBase64(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'');}
function inviteUnbase64(text){if(!/^[A-Za-z0-9_-]+$/.test(text))throw new Error('INVITE_INVALID');return Uint8Array.from(atob(text.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));}
function inviteParse(code){const p=String(code).trim().split('.');if(p.length!==3||p[0]!=='FMI-DEMO'||!/^DEMO-INVITE-[A-Z0-9-]+$/.test(p[1]))throw new Error('INVITE_INVALID');return {id:p[1],secret:p[2]};}
function inviteError(key){return ({INVITE_INVALID:'邀请码无效，请检查完整内容',INVITE_MISSING:'未找到邀请；演示码仅适用于此浏览器中的模拟链',INVITE_PENDING:'邀请尚未确认，请等待交易结果',INVITE_USED:'邀请码已使用，不能重复加入',INVITE_EXPIRED:'邀请码已过期，请管理员重新生成',INVITE_REVOKED:'邀请码已撤销，请管理员重新生成',INVITE_RPC:'Sui 暂不可用，尚未确认加入',INVITE_PERMISSION:'只有当前组织管理员可以生成或撤销邀请',INVITE_CONSENT:'请确认目标组织和本机执行权限',INVITE_FAILED:'模拟交易失败，邀请码尚未消费，可以重试',INVITE_BINDING:'组织连接配置已变化，请管理员重新生成邀请',INVITE_PROOF:'兑换证明与设备或邀请不匹配',INVITE_SCOPE:'邀请权限不匹配，不能扩大范围',INVITE_CANCELLED:'组织上下文已变化，请重新操作',INVITE_CRYPTO:'此浏览器无法生成演示签名，请使用支持 Ed25519 的浏览器'})[key]||'操作未完成，请重试';}
function inviteAssertAvailable(i){
  if(!chainDemo().rpc)throw new Error('INVITE_RPC');if(!i)throw new Error('INVITE_MISSING');
  const s=invitationState(i);if(s!=='active')throw new Error(({pending:'INVITE_PENDING',consumed:'INVITE_USED',expired:'INVITE_EXPIRED',revoked:'INVITE_REVOKED',failed:'INVITE_FAILED'})[s]||'INVITE_INVALID');
  if(i.network!=='DEMO-SUI'||i.package!=='DEMO-PACKAGE')throw new Error('INVITE_INVALID');
  if(!state.fleet.coordinators.some(c=>c.id===i.coordinator&&c.orgId===i.orgId&&c.binding==='confirmed'))throw new Error('INVITE_BINDING');
}
async function prepareHostInvite(options={}){
  if(currentOrg().role!=='admin'||mobileReadOnly()||!identityAllowed('manage'))throw new Error('INVITE_PERMISSION');
  if(!chainDemo().rpc)throw new Error('INVITE_RPC');
  const orgId=state.orgId,coordinator=fleet().coordinators.find(c=>c.id===options.coordinator&&c.binding==='confirmed');
  if(!coordinator)throw new Error('INVITE_BINDING');
  const minutes=Number(options.minutes??60);if(![15,60,1440].includes(minutes))throw new Error('INVITE_INVALID');
  let key;try{key=await crypto.subtle.generateKey({name:'Ed25519'},true,['sign','verify']);}catch{throw new Error('INVITE_CRYPTO');}
  const publicKey=inviteBase64(await crypto.subtle.exportKey('raw',key.publicKey)),secret=inviteBase64(await crypto.subtle.exportKey('pkcs8',key.privateKey));
  if(state.orgId!==orgId||currentOrg().role!=='admin'||!identityAllowed('manage'))throw new Error('INVITE_CANCELLED');
  const i={id:'DEMO-INVITE-'+crypto.randomUUID().toUpperCase(),orgId,network:'DEMO-SUI',package:'DEMO-PACKAGE',publicKey,coordinator:coordinator.id,scope:'fractalmind-os 工作区',execute:true,desktop:!!options.desktop,grantMs:7*86400000,createdAt:Date.now(),expires:Date.now()+minutes*60000,maxUses:1,status:'pending',usedBy:null};
  const tx={id:demoId('TX'),orgId,inviteId:i.id,kind:'invite-create',status:'pending'};i.createTx=tx.id;
  invitations().push(i);chainDemo().transactions.push(tx);inviteSecrets.set(i.id,`FMI-DEMO.${i.id}.${secret}`);save();return i;
}
function confirmHostInvite(i,success=true){
  if(!chainDemo().rpc)throw new Error('INVITE_RPC');
  if(!i||i.orgId!==state.orgId||currentOrg().role!=='admin'||mobileReadOnly()||!identityAllowed('manage'))throw new Error('INVITE_PERMISSION');
  const tx=chainDemo().transactions.find(t=>t.id===i.createTx);if(!tx||tx.status!=='pending')return false;
  if(!success){tx.status='failed';i.status='failed';inviteSecrets.delete(i.id);save();return false;}
  tx.status='confirmed';i.status='active';save();return true;
}
function invitationTerms(i){return JSON.stringify([i.network,i.package,i.id,i.orgId,i.coordinator,i.scope,i.execute,i.desktop,i.grantMs,i.expires,i.maxUses]);}
function invitationProofMessage(payload){return inviteBytes(JSON.stringify(['FRACTALMIND_HOST_REDEEM_DEMO_V1',payload.network,payload.package,payload.inviteId,payload.orgId,payload.device,payload.nonce,payload.terms]));}
async function prepareInviteRedemption(code,values={}){
  if(mobileReadOnly())throw new Error('INVITE_PERMISSION');
  if(!values.consent)throw new Error('INVITE_CONSENT');
  const {id,secret}=inviteParse(code),i=inviteById(id);inviteAssertAvailable(i);
  const payload={network:i.network,package:i.package,inviteId:i.id,orgId:i.orgId,device:values.device||demoId('DEVICE'),nonce:crypto.randomUUID(),terms:invitationTerms(i)};
  let proof;try{const key=await crypto.subtle.importKey('pkcs8',inviteUnbase64(secret),{name:'Ed25519'},false,['sign']);proof=inviteBase64(await crypto.subtle.sign('Ed25519',key,invitationProofMessage(payload)));}catch{throw new Error('INVITE_INVALID');}
  inviteAssertAvailable(i);
  const tx={id:demoId('TX'),orgId:i.orgId,inviteId:i.id,kind:'invite-redeem',status:'pending',sender:payload.device,payload,proof,host:{name:String(values.name||'New Host').trim().slice(0,60)||'New Host',os:values.os||'Ubuntu · amd64',kind:values.kind==='cloud'?'cloud':'local',desktop:!!values.desktop,consent:true}};
  chainDemo().transactions.push(tx);save();return tx;
}
async function confirmInviteRedemption(tx,success=true){
  if(!tx||tx.kind!=='invite-redeem'||tx.status!=='pending')throw new Error('INVITE_USED');
  if(!chainDemo().rpc)throw new Error('INVITE_RPC');
  if(!success){tx.status='failed';tx.error='INVITE_FAILED';save();throw new Error('INVITE_FAILED');}
  const i=inviteById(tx.inviteId),p=tx.payload;
  try{
    inviteAssertAvailable(i);
    if(p.inviteId!==i.id||p.orgId!==i.orgId||p.network!==i.network||p.package!==i.package||tx.sender!==p.device||!tx.host.consent)throw new Error('INVITE_PROOF');
    if(p.terms!==invitationTerms(i))throw new Error('INVITE_SCOPE');
    const publicKey=await crypto.subtle.importKey('raw',inviteUnbase64(i.publicKey),{name:'Ed25519'},false,['verify']);
    if(!await crypto.subtle.verify('Ed25519',publicKey,inviteUnbase64(tx.proof),invitationProofMessage(p)))throw new Error('INVITE_PROOF');
    // Recheck after async verification. The consumption and grants below are one synchronous demo commit.
    inviteAssertAvailable(i);if(tx.status!=='pending')throw new Error('INVITE_USED');
    if(p.terms!==invitationTerms(i))throw new Error('INVITE_SCOPE');
    const hostId=demoId('HOST'),r={id:demoId('JOIN'),orgId:i.orgId,inviteId:i.id,device:p.device,hostId,name:tx.host.name,os:tx.host.os,kind:tx.host.kind,desktop:i.desktop&&tx.host.desktop,coordinator:i.coordinator,scope:i.scope,consent:true,status:'authorized',expires:i.expires,tx:null};
    const host={id:hostId,orgId:i.orgId,device:p.device,authorityMigrated:true,name:r.name,kind:r.kind,coordinator:r.coordinator,location:'—',os:r.os,status:'pending',cpu:0,mem:0,ram:16,disk:256,desktop:r.desktop,accepting:true,workspace:r.scope,lastSeen:new Date().toISOString(),heartbeat:null,uptime:'尚未上线',version:'待确认',commands:[],audit:[]};
    const member={id:demoId('MEMBER'),orgId:i.orgId,hostId,device:p.device,status:'confirmed',inviteId:i.id};
    const grant={id:demoId('GRANT'),orgId:i.orgId,hostId,status:'confirmed',scope:i.scope,execute:i.execute,desktop:r.desktop,expires:Date.now()+i.grantMs,inviteId:i.id};
    const ledger=chainDemo();i.status='consumed';i.usedBy=p.device;i.consumedAt=Date.now();i.hostId=hostId;
    ledger.requests.push(r);ledger.memberships.push(member);ledger.grants.push(grant);state.fleet.hosts.push(host);tx.status='confirmed';tx.requestId=r.id;
    inviteSecrets.delete(i.id);save();return r;
  }catch(error){if(error.message!=='INVITE_RPC'){tx.status='failed';tx.error=error.message;save();}throw error;}
}
function revokeHostInvite(i){

// Human identity review model. These records simulate Sui; no real keys, biometrics or encryption.
const recoverySecrets = new Map();
let identityView = null;
function identityModel() {
  if(state.entry?.fresh&&!state.identityDemo)return {id:'',name:'',devices:[],requests:[],transactions:[],events:[],generation:0,keyVersion:0};
  ensureOrganizationModel();
  if (!state.identityDemo) {
    const orgs=state.organizationRegistry.map(o=>o.id);
    state.identityDemo={id:'DEMO-HUMAN-YUBING',name:'Yubing',generation:1,currentDevice:'DEMO-APP-MAC',locked:false,lost:false,
      devices:[{id:'DEMO-APP-MAC',name:'MacBook Pro',platform:'macOS',status:'active',orgs,operate:true,manage:true,expires:0,generation:1,dataOrgs:[...orgs],keyVersion:1}],
      requests:[],transactions:[],events:[],keyVersion:1,recovery:null,unlock:'system'};
    if(state.phonePaired)state.identityDemo.devices.push({id:'DEMO-APP-PHONE',name:'iPhone',platform:'iOS',status:'active',orgs:[state.phoneAccess?.orgId||state.orgId],operate:!!state.phoneAccess?.operate,manage:false,expires:Date.now()+7*86400000,generation:1,dataOrgs:[state.phoneAccess?.orgId||state.orgId],keyVersion:1});
  }
  return state.identityDemo;
}
function identityDevice(){const m=identityModel();return m.devices.find(d=>d.id===m.currentDevice);}
function identityDeviceActive(d){const m=identityModel();return !!d&&d.status==='active'&&d.generation===m.generation&&(!d.expires||d.expires>Date.now());}
function identityAllowed(action='operate',orgId=state.orgId){
  const m=identityModel(),d=identityDevice();
  return !state.entry?.signedOut&&!m.locked&&!m.lost&&chainDemo().rpc&&identityDeviceActive(d)&&(d.orgs.includes(orgId)||(!orgId&&action==='manage'&&d.manage))&&(action==='read'||(action==='manage'?d.manage:d.operate));
}
function identityDataReady(orgId=state.orgId){const m=identityModel(),d=identityDevice();return !state.entry?.signedOut&&!m.locked&&!m.lost&&identityDeviceActive(d)&&d.dataOrgs.includes(orgId)&&d.keyVersion===m.keyVersion;}
function identityEvent(text,deviceId=''){const m=identityModel();m.events.unshift({id:demoId('IDENTITY-EVENT'),text,deviceId,at:new Date().toISOString()});save();}
function identityRequest(platform,name){
  if(!identityAllowed('manage'))throw new Error('当前设备没有身份管理权限');
  if(!['iOS','Android','macOS','Windows','Ubuntu'].includes(platform))throw new Error('请选择支持的平台');
  const r={id:demoId('PAIR'),humanId:identityModel().id,deviceId:demoId('APP'),name:String(name||platform).trim().slice(0,60),platform,orgId:state.orgId,status:'pairing',expires:Date.now()+5*60000,generation:identityModel().generation};
  identityModel().requests.push(r);save();return r;
}
function identityBegin(kind,targetId,options={}){
  const m=identityModel(),d=identityDevice();
  if(!identityAllowed('manage'))throw new Error('当前设备没有身份管理权限');
  if(m.transactions.some(t=>t.status==='pending'))throw new Error('请先查询待确认交易');
  const r=m.requests.find(r=>r.id===targetId),target=m.devices.find(d=>d.id===targetId);
  if(kind==='add'&&(!r||r.status!=='scanned'||r.expires<=Date.now()||r.orgId!==state.orgId||r.generation!==m.generation))throw new Error('配对已过期或上下文已变化，请重新开始');
  if(kind==='revoke'&&(!identityDeviceActive(target)||target.id===d.id))throw new Error('请选择另一台有效设备');
  if(!['add','revoke','rotate'].includes(kind))throw new Error('操作不可用');
  const tx={id:demoId('IDENTITY-TX'),kind,targetId,orgId:state.orgId,issuer:d.id,generation:m.generation,status:'pending',options:{operate:!!options.operate,shareData:!!options.shareData,days:[7,30].includes(Number(options.days))?Number(options.days):7}};
  m.transactions.push(tx);save();return tx;
}
function identitySettle(txId,success=true){
  const m=identityModel(),tx=m.transactions.find(t=>t.id===txId);if(!tx||tx.status!=='pending'||!chainDemo().rpc)return false;
  const issuer=m.devices.find(d=>d.id===tx.issuer),r=m.requests.find(r=>r.id===tx.targetId),target=m.devices.find(d=>d.id===tx.targetId);
  if(!success||!identityDeviceActive(issuer)||!issuer.manage||!issuer.orgs.includes(tx.orgId)||tx.generation!==m.generation||(tx.kind==='add'&&(!r||r.status!=='scanned'||r.expires<=Date.now()||r.orgId!==tx.orgId||r.generation!==m.generation))){tx.status='failed';save();return false;}
  if(tx.kind==='add'){
    m.devices.push({id:r.deviceId,name:r.name,platform:r.platform,status:'active',orgs:[tx.orgId],operate:tx.options.operate,manage:false,expires:Date.now()+tx.options.days*86400000,generation:m.generation,dataOrgs:[],keyVersion:m.keyVersion});
    r.status='authorized';r.shareData=tx.options.shareData;identityEvent('新设备授权已确认',r.deviceId);
  }else if(tx.kind==='revoke'){
    if(!identityDeviceActive(target)||target.id===issuer.id){tx.status='failed';save();return false;}
    target.status='revoked';identityEvent('设备授权已撤销',target.id);
  }else{
    m.keyVersion++;for(const d of m.devices)if(identityDeviceActive(d))d.keyVersion=m.keyVersion;
    identityEvent('后续数据已切换到新的密钥版本');
  }
  tx.status='confirmed';save();return true;
}
function identitySyncData(deviceId){
  const m=identityModel(),d=m.devices.find(d=>d.id===deviceId),r=m.requests.find(r=>r.deviceId===deviceId);
  if(!identityAllowed('manage')||!identityDeviceActive(d)||!r?.shareData)return false;
  const source=identityDevice();if(!d.orgs.every(org=>source.dataOrgs.includes(org))||source.keyVersion!==m.keyVersion)return false;
  d.dataOrgs=[...d.orgs];d.keyVersion=m.keyVersion;identityEvent('加密数据访问已就绪',d.id);save();return true;
}
async function recoveryDigest(secret){const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(secret));return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');}
async function identityCreateKit(){
  if(!identityAllowed('manage'))throw new Error('当前设备没有身份管理权限');
  const m=identityModel(),generation=m.generation,issuer=m.currentDevice;
  const secret='DEMO-RECOVERY-'+crypto.randomUUID().toUpperCase(),hash=await recoveryDigest(secret);
  if(identityModel()!==m||m.generation!==generation||m.currentDevice!==issuer||!identityAllowed('manage'))throw new Error('身份状态已变化，请重试');
  m.recovery={hash,version:(m.recovery?.version||0)+1,saved:false,dataBackup:true,orgs:state.organizationRegistry.map(o=>o.id)};
  recoverySecrets.set(m.id,secret);identityEvent('恢复包已生成，请离线保存');save();return secret;
}
async function identityRecover(secret){
  const m=identityModel(),recovery=m.recovery;
  if(!chainDemo().rpc)throw new Error('Sui 暂不可用，恢复尚未确认');
  if(!recovery?.saved||!String(secret).trim().startsWith('DEMO-RECOVERY-')||await recoveryDigest(String(secret).trim())!==recovery.hash)throw new Error('恢复码不匹配，请使用已保存的演示恢复包');
  if(identityModel()!==m||m.recovery!==recovery||!chainDemo().rpc)throw new Error('身份状态已变化，请重试');
  m.generation++;for(const d of m.devices)d.status='revoked';for(const tx of m.transactions)if(tx.status==='pending')tx.status='cancelled';
  for(const r of m.requests)if(['pairing','scanned'].includes(r.status))r.status='cancelled';
  const d={id:demoId('APP'),name:'Recovered device',platform:'macOS',status:'active',orgs:[...recovery.orgs],operate:true,manage:true,expires:0,generation:m.generation,dataOrgs:[],keyVersion:m.keyVersion,recoveryData:recovery.dataBackup};
  m.devices.push(d);m.currentDevice=d.id;m.lost=false;m.locked=false;
  // A recovery proof must not remain reusable as an authorization credential.
  m.recovery=null;recoverySecrets.delete(m.id);state.phonePaired=false;state.phoneAccess=null;
  identityEvent('身份权限已恢复，旧设备授权已失效',d.id);save();return d;
}
function identityRestoreData(){const d=identityDevice();if(!identityAllowed('manage')||!d.recoveryData)return false;d.dataOrgs=[...d.orgs];d.keyVersion=identityModel().keyVersion;d.recoveryData=false;identityEvent('加密数据已从恢复材料找回',d.id);save();return true;}
function identityKitText(){const m=identityModel(),secret=recoverySecrets.get(m.id);if(!secret)return null;return ['FRACTALMIND — DEMO RECOVERY KIT','Prototype only. No real wallet, key or chain transaction.',`Identity: ${m.id}`,'Network: LOCAL SIMULATION',`Version: ${m.recovery.version}`,`Recovery code: ${secret}`,'Restores simulated authority and data access. Store separately from your devices.','After recovery: old devices are revoked; save a new kit.'].join('\n');}
function identityStatus(d){return d.status==='revoked'?'已撤销':!identityDeviceActive(d)?'已过期':'授权有效';}

// First-use session: profiles keep previous review data separate from new identities.
let entryScreen='welcome';
function entryButton(action,label,extra='',style=''){return `<button class="btn ${style}" type="button" data-entry="${action}" ${extra}>${label}</button>`;}
function entrySignOut(){
  for(const g of state.goals){g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;}
  state.entry={...state.entry,signedOut:true};entryScreen='welcome';closeOverlay();save();render();
}
function entryCreate(name,platform,unlock){
  name=String(name).trim();if(!name||name.length>60)throw new Error('请输入身份名称');
  if(!state.entry?.signedOut)throw new Error('请从首次使用页开始');
  if(!['macOS','Windows','Ubuntu','iOS','Android'].includes(platform))throw new Error('请选择支持的平台');
  state.entry.registration={id:demoId('HUMAN'),deviceId:demoId('APP'),name,platform,unlock,status:'pending'};save();return state.entry.registration;
}
function entryConfirmCreation(success=true){
  const r=state.entry?.registration;if(!state.entry?.signedOut||r?.status!=='pending')return false;
  if(!chainDemo().rpc)return false;
  if(!success){r.status='failed';save();return false;}
  r.status='confirmed';const record={...r};save();
  profileKey=KEY+'.profile.'+r.id;
  state={...legacyDefaults(),newIdentity:true,entry:{signedOut:false},goals:[],tasks:[],memories:[],organizationRegistry:[],orgId:'',orgRuntime:{},fleet:{hosts:[],instances:[],coordinators:[]},
    identityDemo:{id:record.id,name:record.name,generation:1,currentDevice:record.deviceId,locked:false,lost:false,devices:[{id:record.deviceId,name:record.platform+' App',platform:record.platform,status:'active',orgs:[],operate:true,manage:true,expires:0,generation:1,dataOrgs:[],keyVersion:1}],requests:[],transactions:[],events:[],keyVersion:1,recovery:null,unlock:record.unlock}};
  ensureOrganizationModel();identityEvent('身份创建已确认');save();return true;
}
function entryCreateOrganization(name){
  if(!state.newIdentity||state.organizationRegistry.length||!identityAllowed('manage'))throw new Error('当前设备没有身份管理权限');
  name=String(name).trim();if(!name||name.length>60)throw new Error('请输入组织名称');
  const o={id:demoId('ORG'),name,kind:'personal',role:'admin'};state.organizationRegistry.push(o);state.orgId=o.id;state.orgRuntime[o.id]={paused:[]};
  const d=identityDevice();d.orgs.push(o.id);d.dataOrgs.push(o.id);if(identityModel().recovery)identityModel().recovery.orgs.push(o.id);
  identityEvent('个人组织创建已确认');save();return o;
}
// Explicitly simulate the already trusted device, never give the new device its authority.
function entryOnTrustedDevice(fn){
  const m=identityModel(),issuer=m.devices.find(d=>identityDeviceActive(d)&&d.manage&&d.orgs.includes(state.orgId));
  if(state.entry?.fresh||m.lost||!issuer)throw new Error('没有可用的管理设备，请使用恢复包');
  const previous=m.currentDevice,locked=m.locked,signedOut=state.entry?.signedOut;
  m.currentDevice=issuer.id;m.locked=false;state.entry??={};state.entry.signedOut=false;
  try{return fn();}finally{m.currentDevice=previous;m.locked=locked;state.entry.signedOut=signedOut;save();}
}
function entryPairStart(platform,name){
  if(!state.entry?.signedOut)throw new Error('请从首次使用页开始');
  const r=entryOnTrustedDevice(()=>identityRequest(platform,name));state.entry.pairId=r.id;save();return r;
}
function entryPairApprove(operate=false){
  if(!chainDemo().rpc)throw new Error('Sui 暂不可用，新的授权暂停');
  const r=identityModel().requests.find(r=>r.id===state.entry?.pairId);
  if(!state.entry?.signedOut||!r||r.expires<=Date.now()||r.status!=='pairing')throw new Error('配对已过期或上下文已变化，请重新开始');
  return entryOnTrustedDevice(()=>{r.status='scanned';const tx=identityBegin('add',r.id,{operate,shareData:true,days:7});identitySettle(tx.id);if(tx.status!=='confirmed'){r.status='pairing';throw new Error('Sui 暂不可用，新的授权暂停');}return r;});
}
function entryPairFinish(){
  const r=identityModel().requests.find(r=>r.id===state.entry?.pairId);
  if(!state.entry?.signedOut||r?.status!=='authorized'||!entryOnTrustedDevice(()=>identitySyncData(r.deviceId)))throw new Error('当前设备无法同步此组织的数据密钥');
  const m=identityModel();m.currentDevice=r.deviceId;m.locked=false;state.entry={signedOut:false};save();return r;

function filteredTasks(){return orgTasks().filter(t=>(filter==='all'||t.status===filter)&&(t.name+(orgGoals().find(g=>g.id===t.goal)?.name||'')).toLowerCase().includes(taskQuery.toLowerCase()));}
// Agent discovery snapshots are rebuildable observations; confirmed imports/grants simulate Sui state.
let discoveryHost='',discoveryScenario='normal';
function discoveryCanManage(){return identityAllowed('manage')&&identityDataReady()&&currentOrg()?.role==='admin';}
function discoveryModel(){return state.discovery??={snapshots:{},imports:[],transactions:[]};}
function discoveredImports(hostId=''){return discoveryModel().imports.filter(r=>r.orgId===state.orgId&&(!hostId||r.hostId===hostId));}
function discoveryRecord(id){return discoveredImports().find(r=>r.id===id);}
function discoveryKey(h,session){return [h.orgId,h.device,'demo-adapter',session].join('/');}
function discoveryScan(hostId,scenario='normal'){
  const h=hostById(hostId);if(!identityAllowed('read')||!identityDataReady()||!h||!hostAuthorized(h,'read'))throw new Error('没有此组织的发现权限');
  if(!hostReachable(h))throw new Error('主机失联，无法扫描；保留最后观测');
  const time=Date.now();const rows=scenario==='empty'?[]:[
    {session:'agent-builder',name:'Builder',adapter:'FractalMind adapter · DEMO',capable:true,verified:true,work:'正在运行独立任务，等待交接确认'},
    {session:'EMP_0042',name:'Researcher',adapter:'tmux',capable:false,verified:true,work:'tmux 会话运行中；内部任务未知'},
    {session:'team-legacy',name:'Legacy Agent',adapter:'unknown',capable:false,verified:false,work:'缺少身份与工作区证明'}
  ].map(row=>({...row,key:discoveryKey(h,row.session),orgId:h.orgId,hostId:h.id,device:h.device,workspace:h.workspace,observedAt:time,capable:scenario==='unsupported'?false:row.capable}));
  // Names alone never establish identity. Stable host/device + adapter + session locate this demo runtime.
  discoveryModel().snapshots[h.id]={orgId:h.orgId,device:h.device,at:time,rows};save();return rows;
}
function discoveryCandidate(key){const snapshots=Object.values(discoveryModel().snapshots);return snapshots.filter(s=>s.orgId===state.orgId).flatMap(s=>s.rows).find(r=>r.key===key);}
function discoveryFresh(r){const h=hostById(r?.hostId);const latest=discoveryCandidate(r?.key);return !!h&&!!latest&&latest.verified===r.verified&&latest.capable===r.capable&&r.orgId===state.orgId&&r.device===h.device&&r.workspace===h.workspace&&Date.now()-r.observedAt<5*60000&&hostReachable(h)&&hostAuthorized(h,'read');}
function discoveryBoundary(g){return JSON.stringify([g.orgId,g.id,g.scope,g.budget,g.deadline,g.allowed,g.escalate,g.criteria,g.krs.map(k=>[k.id,k.target,k.verification])]);}
function discoveryRuntimeReady(r){const latest=discoveryCandidate(r?.key);return !!latest&&discoveryFresh(latest)&&latest.verified&&latest.device===r.device&&latest.workspace===r.workspace&&(r.mode!=='managed'||latest.capable);}
function discoveryManaged(r,g){return r?.mode==='managed'&&r.goalId===g.id&&r.agentId===g.owner&&r.hostId===g.hostId&&r.boundary===discoveryBoundary(g)&&r.device===hostById(r.hostId)?.device;}
function discoveryBegin(kind,key,goalId=''){
  if(!discoveryCanManage())throw new Error('需要组织管理设备确认导入与授权');
  const m=discoveryModel(),r=kind==='import'?discoveryCandidate(key):discoveryRecord(key),h=hostById(r?.hostId);
  if(!['import','manage'].includes(kind)||!r||!h||!hostReachable(h)||!hostAuthorized(h))throw new Error('主机或授权不可用，请重新扫描');
  if(m.transactions.some(t=>t.orgId===state.orgId&&t.key===key&&t.status==='pending'))throw new Error('请先确认已有导入交易');
  if(kind==='import'){
    if(!discoveryFresh(r)||!r.verified)throw new Error('观测已过期或身份未核实，请重新扫描');
    if(discoveredImports().some(i=>i.key===key))throw new Error('此运行实例已经导入');
  }
  const g=orgGoals().find(g=>g.id===goalId);
  if(kind==='manage'){
    if(!discoveryRuntimeReady(r))throw new Error('观测已失效 · 需要重新发现');
    if(!['observe','managed'].includes(r.mode)||!r.capable)throw new Error('此适配器仅支持观察，无法执行 OKR 约束');
    if(r.mode==='managed'&&r.goalId!==goalId)throw new Error('已有授权只允许重新确认原目标');
    if(!g||g.lifecycle!=='ACTIVE'||g.scope!==r.workspace||!hostReachable(goalHost(g)))throw new Error('请选择工作区匹配且原执行主机可达的 ACTIVE OKR');
    if(orgGoals().some(x=>x.id!==g.id&&x.owner===r.agentId&&x.lifecycle==='ACTIVE'))throw new Error('此实例已有运行目标');
  }
  const tx={id:demoId('AGENT-TX'),orgId:state.orgId,kind,key,status:'pending',issuer:identityModel().currentDevice,generation:identityModel().generation,candidate:kind==='import'?{...r}:null,goalId,boundary:g?discoveryBoundary(g):'',previous:g?JSON.stringify([g.owner,g.hostId,g.autoEpoch]):'',created:Date.now()};
  m.transactions.push(tx);save();return tx;
}
function discoverySettle(id,success=true){
  const tx=discoveryModel().transactions.find(t=>t.id===id&&t.orgId===state.orgId);if(!tx||tx.status!=='pending')return false;
  if(!chainDemo().rpc)return false;
  const fail=()=>{tx.status='failed';save();return false;};
  if(!success||!discoveryCanManage()||identityModel().currentDevice!==tx.issuer||identityModel().generation!==tx.generation||Date.now()-tx.created>5*60000)return fail();
  const r=tx.kind==='import'?tx.candidate:discoveryRecord(tx.key),h=hostById(r?.hostId);if(!h||!hostReachable(h)||!hostAuthorized(h)||h.device!==r.device||h.workspace!==r.workspace)return fail();
  if(tx.kind==='manage'&&!discoveryRuntimeReady(r))return fail();
  if(tx.kind==='import'){
    if(!discoveryFresh(r)||!r.verified||discoveredImports().some(i=>i.key===r.key))return fail();
    discoveryModel().imports.push({...r,id:demoId('IMPORT'),agentId:demoId('AGENT'),mode:'observe',importedAt:Date.now()});
    // Observing an existing runtime never creates, restarts, or reassigns it.
  }else{
    const g=orgGoals().find(g=>g.id===tx.goalId);
    if(!g||g.lifecycle!=='ACTIVE'||!r.capable||!['observe','managed'].includes(r.mode)||(r.mode==='managed'&&r.goalId!==g.id)||!hostReachable(goalHost(g))||g.scope!==r.workspace||discoveryBoundary(g)!==tx.boundary||JSON.stringify([g.owner,g.hostId,g.autoEpoch])!==tx.previous)return fail();
    g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=true;g.blocker=null;
    if(r.mode==='observe'){r.previousOwner=g.owner;r.previousHost=g.hostId;}r.mode='managed';r.goalId=g.id;r.boundary=tx.boundary;
    g.owner=r.agentId;g.hostId=r.hostId;
    const existing=state.fleet.instances.find(i=>i.importId===r.id);if(existing)existing.status='ready';else state.fleet.instances.push({id:r.key,hostId:r.hostId,role:r.agentId,status:'ready',importId:r.id});
    logOKR(g,'已确认既有 Agent 交接与边界，等待明确继续执行。');
  }
  tx.status='confirmed';hostLog(h,tx.kind==='import'?'既有 Agent 已导入为仅观察；原会话保持运行。':'既有 Agent 已接受此 OKR 的约束，等待明确继续。');save();return true;
}
function discoveryStatus(r){const h=hostById(r.hostId);if(!hostReachable(h))return '主机失联 · 状态未知';if(!hostAuthorized(h,'read'))return '主机授权不可用';if(!discoveryRuntimeReady(r))return '观测已失效 · 需要重新发现';if(r.mode==='managed'){const g=orgGoals().find(g=>g.id===r.goalId);return g&&discoveryManaged(r,g)?'已授权 · 受 OKR 管理':'边界已变化 · 需重新授权';}return '已导入 · 仅观察';}

function discoveryBoundaryPreview(g){return g?`<section class="discovery-boundary"><p><strong>工作范围</strong> · ${esc(g.scope)}</p><p><strong>费用上限</strong> · $${g.budget}</p><p><strong>截止日期</strong> · ${esc(g.deadline)}</p><p><strong>可自主执行</strong> · ${esc(g.allowed)}</p><p><strong>需要升级确认</strong> · ${esc(g.escalate)}</p></section>`:'<div class="notice">没有工作区匹配的 ACTIVE OKR。先创建目标，再进行授权。</div>';}
document.addEventListener('change',e=>{if(e.target.id==='discovery-host'){discoveryHost=e.target.value;discoveryDraw();}if(e.target.id==='discovery-scenario')discoveryScenario=e.target.value;if(e.target.id==='discovery-goal'){$('#discovery-boundary').innerHTML=discoveryBoundaryPreview(orgGoals().find(g=>g.id===e.target.value));translateDOM($('#discovery-boundary'));}});
document.addEventListener('submit',e=>{if(!['discovery-import-form','discovery-manage-form'].includes(e.target.id))return;e.preventDefault();try{const form=e.target;discoveryTransaction(discoveryBegin(form.id==='discovery-import-form'?'import':'manage',form.dataset.key||form.dataset.id,new FormData(form).get('goal')||''));}catch(error){toast(error.message);}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-discovery]');if(!el||el.disabled)return;const a=el.dataset.discovery,id=el.dataset.id;try{
  if(a==='open')discoveryOpen(id);
  if(a==='scan'){discoveryScan(discoveryHost,discoveryScenario);discoveryDraw();}
  if(a==='import')discoveryImportDialog(id);
  if(a==='detail')discoveryDetail(id);
  if(a==='manage')discoveryManageDialog(id);
  if(a==='transaction')discoveryTransaction(discoveryModel().transactions.find(t=>t.id===id));
  if(a==='confirm'||a==='fail'){const tx=discoveryModel().transactions.find(t=>t.id===id);if(discoverySettle(id,a==='confirm')){render();const r=tx.kind==='import'?discoveredImports().find(r=>r.key===tx.key):discoveryRecord(tx.key);discoveryDetail(r.id);}else discoveryTransaction(tx);}
  if(a==='host')openFleetHost(discoveryRecord(id).hostId,'agents');
  if(a==='navigation'){const r=discoveryRecord(id);watchedOKR=r.goalId;go('home');}
}catch(error){if($('#discovery-error'))$('#discovery-error').textContent=localizedText(error.message);else toast(error.message);}});

function hostById(id){return fleet().hosts.find(h=>h.id===id);}

function hostConsole(h){return `<section class="card host-console"><div class="row between"><h3>远程控制台</h3><span class="badge">通过 ${esc(coordinatorFor(h)?.name)} · 演示</span></div><p class="muted" style="font-size:11px;margin-top:9px">命令发往当前选中的主机与实例；执行结果按命令保留。</p><form id="fleet-command-form" data-id="${h.id}"><div class="host-command-fields"><label class="field">操作<select name="command" id="host-command-kind">${[['status','节点状态'],['logs','Agent 日志'],['restart','重启 Agent'],['kill','停止 Agent'],['shell','Shell 命令']].map(([v,l])=>`<option value="${v}">${l} · ${v}</option>`).join('')}</select></label><label class="field">Agent 实例<select name="instance" aria-label="命令目标 Agent" disabled>${hostInstances(h).map(a=>`<option value="${a.id}">${agentFor(a.role).name} · ${esc(a.id)}</option>`).join('')}</select></label><label class="field host-command-args">参数<input name="args" maxlength="500" aria-label="远程命令参数" placeholder="此操作无需参数" disabled></label><button class="btn primary" type="submit" ${!hostReachable(h)?'disabled':''}>运行演示命令</button></div></form><div class="console-output" role="log" aria-label="远程命令回执">${h.commands.length?h.commands.slice(-8).map(c=>`<div><small>${esc(c.at)} · ${esc(h.name)} · ${esc(c.command)}</small><pre translate="no">${esc(c.output)}</pre></div>`).join(''):'<div><small>FRACTALMIND / REMOTE CONSOLE</small><pre>选择一项操作，查看该主机的模拟回执。\n未建立真实连接，Shell 内容不会被执行。</pre></div>'}</div></section>`;}
function hostDesktop(h){if(!hostAuthorized(h,'desktop'))return '<section class="card empty"><h3>桌面访问尚未授权</h3><p>组织资格和执行权限不自动授予桌面查看或控制。</p></section>';if(!h.desktop)return `<section class="card empty">${icon('laptop')}<h3>这台主机没有图形会话</h3><p>仍可通过远程控制台管理 Agent、读取日志和执行命令。</p><button class="btn" data-fleet="tab" data-id="console">打开控制台</button></section>`;if(desktopDemo.hostId!==h.id)desktopDemo={hostId:h.id,control:false,quality:'clear',zoom:1,touch:'touchpad',stats:false,clicks:0,text:''};const d=desktopDemo,live=hostReachable(h);return `<section class="remote-workspace"><div class="desktop-tools"><span class="badge ${live?'green':''}">${live?'演示画面':'连接中断'}</span><label>画质<select id="desktop-quality" aria-label="远程桌面画质">${[['smooth','流畅 · 720p'],['clear','清晰 · 1080p'],['sharp','精细 · 1440p']].map(([v,l])=>`<option value="${v}" ${d.quality===v?'selected':''}>${l}</option>`).join('')}</select></label><button class="btn small" data-fleet="desktop-zoom" data-id="out" aria-label="缩小远程桌面">−</button><button class="btn small" data-fleet="desktop-zoom" data-id="fit">适应</button><button class="btn small" data-fleet="desktop-zoom" data-id="in" aria-label="放大远程桌面">＋</button><button class="btn small ${d.control?'soft':''}" data-fleet="desktop-control" ${!canOperate()||!live?'disabled':''}>${icon(d.control?'lock':'play')}${d.control?'释放控制':'开始控制（演示）'}</button><button class="btn small" data-fleet="desktop-reconnect" ${!live?'disabled':''}>重新连接</button><button class="icon-btn" data-fleet="desktop-stats" aria-label="桌面连接统计">${icon('info')}</button></div>${d.stats?`<div class="desktop-stats">模拟统计 · ${live?'RTT 28ms · 30fps · 丢包 0.2%':'观测不可用'} · ${d.quality==='smooth'?'2':d.quality==='sharp'?'8':'4'} Mbps · ${Math.round(d.zoom*100)}%</div>`:''}
  <div class="desktop-stage"><div class="desktop-scene ${live?'':'disconnected'}" style="transform:scale(${d.zoom})"><div class="desktop-menubar"><strong data-i18n-content>${esc(h.name)}</strong><span>${esc(h.os)} · 模拟桌面</span></div><div class="desktop-window"><div class="desktop-window-bar"><i></i><i></i><i></i><span>Agent Workspace</span></div><div class="desktop-window-body"><div class="eyebrow" data-i18n-content>${esc(h.workspace)}</div><h3>${hostGoals(h).length?'正在为你的目标工作':'执行环境已就绪'}</h3><p>${hostGoals(h).map(g=>esc(agentFor(g.owner).name+' · '+currentKR(g).id.toUpperCase())).join(' / ')||'等待分配 OKR'}</p><pre>runtime: ready\nnode: ${esc(h.id)}\nagents: ${hostInstances(h).length}\n${d.text?'input (demo): <span translate="no">'+esc(d.text)+'</span>':'等待授权内的下一步动作。'}</pre><button class="btn small" data-fleet="desktop-click" ${!live?'disabled':''}>${icon('folder')}打开工作区（演示）</button>${d.clicks?`<small>已收到 ${d.clicks} 次模拟点击</small>`:''}</div></div><div class="desktop-dock">${['folder','code','agents','target','settings'].map(ic=>`<span>${icon(ic)}</span>`).join('')}</div></div>${!live?'<div class="desktop-lost">画面已过期 · 输入已停止<br><small>恢复主机连接后，重新选择控制模式。</small></div>':''}</div>
  <form id="fleet-desktop-input"><div class="desktop-input"><select id="desktop-touch" aria-label="远程桌面触控方式"><option value="touchpad" ${d.touch==='touchpad'?'selected':''}>触控板模式</option><option value="direct" ${d.touch==='direct'?'selected':''}>直接触控模式</option></select><input name="text" aria-label="模拟键盘输入" placeholder="输入一段文字，演示远程键盘" maxlength="160" ${!d.control||!live?'disabled':''}><button class="btn small" ${!d.control||!live?'disabled':''}>发送输入</button></div></form><p class="fleet-demo-note">${d.control?'控制中 · 演示输入仅影响上方示意画面':'只读查看 · 开始控制后才接受演示输入'}。真实产品复用 Agent Console 的 WebRTC 会话、画质、重连和移动输入能力。</p></section>`;}

function fleetCoordinators(){openOverlay(`<section class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('组织的连接入口','连接地址从链上组织绑定读取；连接不授予成员资格。','link')}${fleet().coordinators.map(c=>`<div class="coordinator-row"><span class="avatar">${icon('link')}</span><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.url)}</small><small>组织绑定：已确认 · 演示</small></div><button class="btn small" data-fleet="coordinator-toggle" data-id="${c.id}">${c.connected?'断开演示连接':'模拟重新连接'}</button></div>`).join('')}<div class="notice">Coordinator 负责连接、观测与转发。持久组织配置由链上确认，重启后从链上重建。新连接入口的绑定需单独管理员交易，本原型展示已有绑定。</div>${enrollmentRoleCards()}</section>`);}

function fleetAssign(g){const source=goalHost(g),canMove=hostReachable(source);openOverlay(`<section class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('选择这个 OKR 的执行主机',esc(g.name),'laptop')}<p class="muted" style="font-size:12px;margin-top:16px">当前：${esc(source?.name)} · ${esc(agentFor(g.owner).name)}</p>${!canMove?'<div class="notice amber" style="margin-top:14px">源主机失联，尚不能确认旧操作是否仍在执行。请先恢复源机连接并核对结果，再进行改派。</div>':''}<div style="margin-top:16px">${fleet().hosts.map(h=>{const reason=hostEligibility(g,h);return `<button class="choice-card" data-fleet="assign-confirm" data-id="${g.id}" data-host="${h.id}" ${reason||!canMove||!canOperate()||h.id===g.hostId?'disabled':''}><span class="avatar">${icon(hostIcon(h))}</span><span class="grow"><strong data-i18n-content>${esc(h.name)} ${h.id===g.hostId?'· 当前':''}</strong><small>${reason||`${h.kind==='cloud'?'云端':'本地'} · 同一工作区 · 可用 ${agentFor(g.owner).name}`}</small></span>${hostBadge(h)}</button>`;}).join('')}</div><div class="notice" style="margin-top:15px">改派会暂停旧循环、保留已记录的 KR 指标与证据，在新主机上等待你继续。文件与运行中进程的迁移不在此演示中执行。</div><div class="dialog-footer"><button class="btn" data-action="close">返回导航</button></div></section>`);}
function assignHost(g,h){if(!canOperate()||!hostReachable(goalHost(g))||hostEligibility(g,h))return false;const from=goalHost(g);g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=true;g.blocker=null;g.hostId=h.id;navigationEvent(g,'assignment',`从 ${from.name} 改派到 ${h.name}；保留检查点，等待明确继续。`);logOKR(g,`执行主机改为 ${h.name}；预算、权限及成功标准保持原约定。`);hostLog(from,'暂停该 OKR 的模拟执行并交接检查点。');hostLog(h,'接收 OKR 检查点，等待明确继续：'+g.name);return true;}
function hostSetConnection(h,online){if(online&&!hostAuthorized(h))return false;if(!coordinatorFor(h)?.connected)return;const wasPending=h.status==='pending';h.status=online?(h.cpu>=90||h.mem>=90?'degraded':'online'):'offline';if(online&&wasPending){h.version='0.1.4 · 示例';h.uptime='刚刚上线 · 演示';}h.heartbeat=online?0:1320;if(online)h.lastSeen=new Date().toISOString();hostLog(h,online?'模拟连接恢复；请核对既有运行后继续。':'模拟心跳中断；运行结果保持未知。');for(const g of hostGoals(h)){g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=true;g.blocker=online?null:'执行主机 '+h.name+' 失联，结果待核对。';}if(desktopDemo.hostId===h.id)desktopDemo.control=false;}
function runHostCommand(h,command,instanceId,args){if(!hostAuthorized(h,['status','logs'].includes(command)?'read':'execute'))return false;if(!hostReachable(h))return false;const mutating=['restart','kill','shell'].includes(command);if(mutating&&!canOperate())return false;if(!['status','logs','restart','kill','shell'].includes(command))return false;const instance=hostInstances(h).find(a=>a.id===instanceId);if(['logs','restart','kill'].includes(command)&&!instance)return false;if(mutating&&instance?.importId){const r=discoveryRecord(instance.importId),g=orgGoals().find(g=>g.id===r?.goalId);if(!g||!discoveryManaged(r,g)||!discoveryRuntimeReady(r))return false;}let output='';if(command==='status')output=JSON.stringify({node:h.id,status:hostState(h),agents:hostInstances(h).map(a=>({id:a.id,status:a.status})),demo:true},null,2);if(command==='logs')output=`[demo] ${instance.id}\n[heartbeat] ${h.name} · sample received\n[workspace] ${h.workspace}\n[okr] ${hostGoals(h).filter(g=>g.owner===instance.role).map(g=>g.name).join(' / ')||'等待分配'}\n[info] 以上为模拟日志。`;if(command==='shell')output=`$ ${args}\n[demo] 请求已记录，未在任何真实主机执行。`;if(command==='restart'||command==='kill'){instance.status=command==='kill'?'stopped':'ready';output=`[demo] ${instance.id} ${command==='kill'?'已停止':'已重启'}。\n已有 OKR 检查点保留；需明确继续执行。`;for(const g of hostGoals(h).filter(g=>g.owner===instance.role)){g.auto=false;g.autoEpoch=(g.autoEpoch||0)+1;g.manualPause=true;g.blocker=command==='kill'?'执行实例已停止。':null;}}
  if(command==='logs'&&args&&/^\d+$/.test(args))output=output.split('\n').slice(-Math.max(1,Math.min(1000,Number(args)))).join('\n');
  const at=new Date().toLocaleTimeString(preferences.locale,{hour12:false});h.commands.push({at,command,instanceId,output});h.commands=h.commands.slice(-40);hostLog(h,`命令 ${command} · ${instanceId||h.id} · 模拟回执已记录`);return true;}
function prepareHostCommand(h,command,instanceId,args=''){if(!hostAuthorized(h,['status','logs'].includes(command)?'read':'execute'))return toast('主机执行授权未确认或已撤销');if(!hostReachable(h))return toast('主机不可达，未发起命令');if(['restart','kill','shell'].includes(command)){if(!canOperate())return toast(blockedMessage());pendingHostCommand={hostId:h.id,command,instanceId,args};openOverlay(`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">${dialogHeader('确认远程操作','核对目标主机与实例，本次为模拟执行。','shield')}<div class="detail-grid"><div><small>主机</small>${esc(h.name)}</div><div><small>命令</small>${esc(command)}</div><div><small>实例</small>${esc(instanceId||'主机级 Shell')}</div><div><small>参数</small>${esc(args||'—')}</div></div><div class="notice">${command==='kill'||command==='restart'?'将暂停该实例负责的 OKR 自主循环，保留已有结果。':'仅生成模拟回执，不执行系统命令。'}</div><div class="dialog-footer"><button class="btn" data-action="close">取消</button><button class="btn primary" data-fleet="run-confirmed">确认演示操作</button></div></section>`);}else{runHostCommand(h,command,instanceId,args);hostTab='console';render();}}
function openFleetHost(id,tab='overview'){if(!hostById(id))return toast('主机记录不存在');selectedHost=id;hostTab=tab;desktopDemo.control=false;go('hosts');}
document.addEventListener('click',e=>{const el=e.target.closest('[data-fleet]');if(!el||el.disabled)return;const action=el.dataset.fleet,id=el.dataset.id,h=hostById(id||selectedHost);switch(action){
case 'host':openFleetHost(id,el.dataset.tab||'overview');break;

case 'host-connection':if(!canOperate())return toast(blockedMessage());hostSetConnection(h,!hostReachable(h));save();render();break;
case 'drain':if(!canOperate()||!hostReachable(h))return toast('主机当前不可操作');h.accepting=!h.accepting;hostLog(h,h.accepting?'恢复接收新 OKR。':'暂停接收新 OKR，当前运行保持原状。');save();render();break;
case 'assign':fleetAssign(orgGoals().find(g=>g.id===id));break;
case 'assign-confirm':{const g=orgGoals().find(g=>g.id===id),target=hostById(el.dataset.host);if(!assignHost(g,target))return toast('主机条件已变化，请重新选择');closeOverlay();render();toast('执行主机已改派；检查点保留，等待你继续');break;}
case 'prepare-command':prepareHostCommand(h,el.dataset.command,el.dataset.agent);break;
case 'run-confirmed':{if(!pendingHostCommand)return;const p=pendingHostCommand;pendingHostCommand=null;if(!runHostCommand(hostById(p.hostId),p.command,p.instanceId,p.args)){closeOverlay();return toast('目标或权限已变化，命令未执行');}closeOverlay();openFleetHost(p.hostId,'console');toast('模拟命令完成，回执已记录');break;}
case 'desktop-control':if(!hostAuthorized(h,'desktop'))return toast('桌面控制未授权');if(!canOperate()||!hostReachable(h))return toast('主机当前不可控制');desktopDemo.control=!desktopDemo.control;hostLog(h,desktopDemo.control?'开始远程桌面控制演示。':'释放远程桌面控制演示。');save();render();break;
case 'desktop-reconnect':if(!hostReachable(h))return toast('先恢复主机连接');desktopDemo.control=false;hostLog(h,'模拟桌面会话重连；恢复为只读查看。');save();render();toast('演示画面已重连，当前为只读');break;
case 'desktop-zoom':desktopDemo.zoom=id==='fit'?1:Math.max(.75,Math.min(1.75,desktopDemo.zoom+(id==='in'?.25:-.25)));render();break;
case 'desktop-stats':desktopDemo.stats=!desktopDemo.stats;render();break;
case 'desktop-click':if(!hostAuthorized(h,'desktop'))return toast('桌面控制未授权');if(!canOperate()||!hostReachable(h)||!desktopDemo.control)return toast('当前只读，请先开始控制演示');desktopDemo.clicks++;render();break;
}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.id.startsWith('fleet-'))return;e.preventDefault();const data=new FormData(form);if(form.id==='fleet-command-form'){const h=hostById(form.dataset.id),command=String(data.get('command')),args=String(data.get('args')||'').trim();if(command==='shell'&&!args)return toast('请输入要演示的 Shell 命令');if(command==='logs'&&args&&(!/^\d+$/.test(args)||Number(args)<1||Number(args)>1000))return toast('日志行数须为 1–1000');return prepareHostCommand(h,command,String(data.get('instance')||''),args);}if(!canOperate())return toast(blockedMessage());

if(form.id==='fleet-desktop-input'){const h=hostById(selectedHost);if(!hostAuthorized(h,'desktop')||!hostReachable(h)||!desktopDemo.control)return toast('请先开始控制演示');desktopDemo.text=String(data.get('text')||'').trim();render();toast('输入已发送到示意画面');}

// Navigation reads the same OKRs and simulator events as the results view.
const navModes={live:'正常推进',drift:'目标偏航',budget:'临近边界',loop:'疑似空转',blocked:'路径阻断',waiting:'等待依赖',unknown:'失去观测'};
function navigation(g){return g.navigation??=( {mode:'live',route:'A',seq:g.tick||0,observedAt:Date.now(),events:[],quote:null} );}
function currentKR(g){return g.krs.find(k=>!krComplete(k)&&k.depends.every(id=>krComplete(g.krs.find(x=>x.id===id))))||g.krs.find(k=>!krComplete(k))||g.krs.at(-1);}
function nextCost(g){const n=navigation(g);return n.quote??(g.id==='app'&&currentKR(g).id==='kr3'&&n.route==='A'?3:1.5);}

  return `<section class="run-proposal"><div class="row between wrap"><h3>Agent 建议方案</h3><span class="badge ${status==='applied'?'green':'amber'}">${labels[status]}</span></div><p><strong>${esc(p.context.kr.toUpperCase())}</strong> · <span data-i18n-content>${esc(p.context.krTitle)}</span></p><small>收到的方向补充</small><blockquote translate="no">${esc(p.brief)}</blockquote><ol>${p.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="run-plan-budget"><span>下一步预计</span><strong>$${p.nextCost.toFixed(2)}</strong><span>预算、权限及成功标准保持原约定。</span></div>${status==='blocked'?`<p class="notice amber">${esc(p.reason)}</p>`:''}${status==='stale'?'<p class="notice amber">运行或约定已变化，请重新请求方案。</p>':''}${status==='proposed'?`<button class="btn primary" data-action="run-plan-apply" data-id="${g.id}" data-proposal="${p.id}" ${communicationUnavailable(g)?'disabled':''}>${icon('play')}采用方案并继续</button>`:['blocked','stale','superseded'].includes(status)?`<button class="btn" data-action="run-chat-prompt" data-id="${g.id}" data-intent="replan">基于最新状态请求方案</button>`:''}</section>`;
}
function communicationMessage(g,m){return `<article class="run-message ${m.role}"><div class="run-message-meta"><strong>${m.role==='user'?'你':agentFor(m.context.owner).name}</strong><span>${m.role==='user'?'已送达 · 演示':'已回应 · 演示'}</span><time>${new Date(m.at).toLocaleTimeString(preferences.locale,{hour12:false})}</time></div><p ${m.role==='user'?'translate="no"':''}>${esc(m.text)}</p>${m.role==='agent'&&m.intent==='explain'?`<div class="run-explanation"><strong>${esc(m.context.label)}</strong><p>${esc(m.context.reason)}</p><small>下一步建议</small><p>${esc(m.context.next)}</p></div>`:''}${m.proposal?communicationProposal(g,m.proposal):''}${m.role==='user'?communicationSnapshot(m.context):''}</article>`;}
function communicationHelp(intent){return intent==='replan'?'发送后暂停当前尝试，生成方案；采用方案后才继续。':intent==='pause'?'发送后暂停当前 OKR 的自主循环，保留已有结果。':'发送消息会保留当前执行状态。聊天不修改目标、预算或权限。';}
function openCommunication(g){
  const c=communication(g),context=communicationContext(g),unavailable=communicationUnavailable(g);
  openOverlay(`<section class="drawer run-dialog" role="dialog" aria-modal="true" aria-labelledby="run-dialog-title"><header class="run-dialog-head"><div class="row">${ava(g.owner)}<div class="grow"><h2 id="run-dialog-title">与 Agent 沟通</h2><small>${agentFor(g.owner).name} · ${esc(context.hostName)}</small></div><button class="icon-btn" data-action="close" aria-label="关闭运行对话">${icon('close')}</button></div><div class="run-chat-objective"><strong data-i18n-content>${esc(g.name)}</strong><div class="row wrap"><span class="badge ${navAssessment(g).color}">${context.label}</span><span class="mono"><span>关联快照</span> · ${esc(context.kr.toUpperCase())} · ${esc(context.run)}</span>${g.manualPause?'<span class="badge">执行已暂停</span>':''}</div></div><p>演示回复与固定方案 · 未连接真实 Agent</p></header><div class="run-dialog-body" id="run-chat-history" role="log" aria-label="运行对话记录" aria-live="polite">${c.messages.length?c.messages.map(m=>communicationMessage(g,m)).join(''):`<div class="run-chat-welcome"><h3>从当前问题开始沟通</h3><p>${esc(context.reason)}</p><p class="muted">消息会附带 OKR、当前 KR、执行主机、检查点和边界，无需重新描述整个任务。</p>${communicationSnapshot(context)}</div>`}</div><form id="run-chat-form" class="run-chat-composer" data-id="${g.id}"><div class="run-chat-prompts">${Object.entries(communicationIntents).map(([id,label])=>`<button class="btn small" type="button" data-action="run-chat-prompt" data-id="${g.id}" data-intent="${id}">${label}</button>`).join('')}</div><label class="run-intent-label">沟通目的<select id="run-chat-intent" name="intent" aria-label="沟通目的">${Object.entries(communicationIntents).map(([id,label])=>`<option value="${id}" ${c.intent===id?'selected':''}>${label}</option>`).join('')}</select></label><textarea id="run-chat-input" name="message" required maxlength="2000" aria-label="给 Agent 的运行消息" placeholder="补充方向、提供线索，或告诉 Agent 你希望它解释什么…">${esc(c.draft)}</textarea><p class="run-chat-help" id="run-chat-help">${communicationHelp(c.intent)}</p>${unavailable?`<div class="notice amber">${esc(unavailable)}</div>`:''}<div class="row between"><small>上下文随消息发送 · 草稿自动保存</small><button class="btn primary" type="submit" ${unavailable?'disabled':''}>${icon('send')}发送消息</button></div></form></section>`,'drawer');
  activeConversation=g.id;save();const history=$('#run-chat-history');history.scrollTop=history.scrollHeight;
}
function promptCommunication(g,intent){if(!Object.hasOwn(communicationIntents,intent))return;const c=communication(g);c.intent=intent;c.draft=localizedText(communicationPrompts[intent]);if(activeConversation!==g.id)openCommunication(g);else{$('#run-chat-intent').value=intent;$('#run-chat-input').value=c.draft;$('#run-chat-help').textContent=communicationHelp(intent);translateDOM($('#run-chat-form'));}save();$('#run-chat-input').focus();}

if(form.id==='chat-form'){const msg=String(data.get('message')||'').trim();const t=orgTasks().find(t=>t.id===activeTask);if(!msg||!t)return;if(!canOperate())return toast(blockedMessage()+'；输入保留为草稿');t.messages.push('你：'+msg,'Agent · 演示回复：我已收到补充说明，会结合当前目标与验收条件继续处理。');t.history.push({text:'你补充了任务说明',icon:'message'});save();drawTask();toast('演示反馈已记录');}
if(form.id==='memory-form'){if(!canOperate())return toast(blockedMessage());const t=orgTasks().find(t=>t.id===form.dataset.task);const title=String(data.get('title')||'').trim(),body=String(data.get('body')||'').trim();if(!title||!body)return;state.memories.unshift({orgId:state.orgId,id:'m'+Date.now(),title,body,type:'成果经验',source:t.name,date:'刚刚'});save();closeOverlay();page='memory';render();toast('记忆已保存，来源已关联到验收成果');}
if(form.id==='edit-memory-form'){if(!canOperate())return toast(blockedMessage());const m=orgMemories().find(m=>m.id===form.dataset.id);m.title=String(data.get('title')||'').trim();m.body=String(data.get('body')||'').trim();if(!m.title||!m.body)return;save();closeOverlay();render();toast('记忆已更新');}
});
document.addEventListener('change',e=>{if(e.target.id==='nav-okr-select'){watchedOKR=e.target.value;render();}if(e.target.dataset.navigationScenario){if(!canOperate()){render();return toast(blockedMessage());}const g=orgGoals().find(g=>g.id===e.target.dataset.navigationScenario);if(g)injectNavigation(g,e.target.value);}});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){taskQuery=e.target.value;$('#task-results').innerHTML=taskRows(filteredTasks());}if(e.target.id==='global-search')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='org-search'){const q=e.target.value.toLowerCase();const found=organizations.filter(o=>(o.name+o.topic+' '+localizedText(o.name+o.topic)).toLowerCase().includes(q));$('#org-results').innerHTML=found.length?found.map(orgCard).join(''):'<div class="card empty" style="grid-column:1/-1">没有找到相关组织，请尝试其他名称。</div>';}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}if(e.key==='Escape')closeOverlay();if(e.key==='Enter'&&e.target.matches('[role="button"][data-action]'))e.target.click();if(e.key==='Tab'&&$('#overlay').classList.contains('open')){const items=[...$('#overlay').querySelectorAll('button:not(:disabled),input,textarea,select,a[href]')].filter(el=>el.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
applyTheme();render();translateDOM();observePresentation();
</script>
</body>
</html>
