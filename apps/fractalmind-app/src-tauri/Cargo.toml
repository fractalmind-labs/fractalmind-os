[package]
name = "fractalmind-app"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "fractalmind_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
fractalmind-device-vault = { path = "../native" }
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
