[[permission]]
identifier = "device-access"
description = "Read or explicitly initialize device public keys, sign self-paid PTBs, sign bounded canonical NodeCommand v1 intents with this device's key, and prove scoped device possession. Explicitly create one recovery backup code and native ciphertext; encrypt/decrypt authenticated product bodies and wrap selected organization keys to an independent device without exporting keys; explicit native recovery-code import/replacement and self-paid recovery signing; no arbitrary raw signing, private-key export, filesystem or shell access."
commands.allow = ["fm_device_public", "fm_device_initialize", "fm_device_sign_transaction", "fm_device_sign_node_command", "fm_device_prove", "fm_onboarding_create", "fm_onboarding_public", "fm_onboarding_sign_transaction", "fm_device_decrypt_record", "fm_device_encrypt_record", "fm_recovery_import", "fm_recovery_imported_public", "fm_recovery_prepare", "fm_recovery_prepared_public", "fm_recovery_sign_transaction", "fm_device_wrap_organization_keys", "fm_device_wrap_command_result_key"]
