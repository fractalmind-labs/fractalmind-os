name: desktop
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-console-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64, rosex-host, agent-console]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build Apple Silicon app bundle
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app
      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p dist-desktop
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist-desktop/$(basename "$app").zip"
          shasum -a 256 dist-desktop/*.zip | tee dist-desktop/SHA256SUMS
      - name: Upload Apple Silicon app
        uses: actions/upload-artifact@v4
        with:
          name: agent-console-macos-arm64
          if-no-files-found: error
          path: |
            dist-desktop/*.app.zip
            dist-desktop/SHA256SUMS
