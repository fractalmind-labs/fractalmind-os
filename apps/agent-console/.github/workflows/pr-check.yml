name: pr-check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: pnpm install
      - name: NodeCommand offline contract tests
        run: pnpm test:node-command
      - name: NodeCommand canonical unavailable regression
        run: pnpm test:node-command:canonical-unavailable
      - name: NodeCommand canonical-source parity
        run: pnpm test:node-command:canonical
      - name: Build (typecheck + bundle)
        run: pnpm build
