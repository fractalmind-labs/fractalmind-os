name: release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets for"
        required: true
        default: "v0.1.4"
      platform:
        description: "Release assets to build"
        required: true
        type: choice
        options:
          - macos
          - all
        default: macos

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify public release and exact tag checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must be an exact vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          }
          release_json="$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease)"
          jq -e --arg tag "$TAG_NAME" '
            .tagName == $tag and .isDraft == false and .isPrerelease == false
          ' <<<"$release_json" >/dev/null
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG_NAME" --jq .sha)"
          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" = "$tag_sha" ]] || {
            echo "Checked-out commit does not match release tag" >&2
            exit 1
          }
          app_version="$(jq -er .version src-tauri/tauri.conf.json)"
          [[ "v$app_version" = "$TAG_NAME" ]] || {
            echo "Tauri version does not match release tag" >&2
            exit 1
          }
          printf 'release_tag=%s\nrelease_sha=%s\n' "$TAG_NAME" "$tag_sha"

  desktop:
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["macos-latest","ubuntu-22.04","windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install JS deps
        run: pnpm install
      - name: Generate Tauri icons
        run: pnpm tauri icon src-tauri/icons/icon.png
      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build desktop app
        run: pnpm tauri build ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
      - name: Upload desktop installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          files=()
          bundle_roots=(
            src-tauri/target/release/bundle
            src-tauri/target/universal-apple-darwin/release/bundle
          )
          for root in "${bundle_roots[@]}"; do
            [ -d "$root" ] || continue
            while IFS= read -r -d '' file; do
              files+=("$file")
            done < <(find "$root" -type f \( \
              -name '*.dmg' -o \
              -name '*.deb' -o \
              -name '*.AppImage' -o \
              -name '*.rpm' -o \
              -name '*.msi' -o \
              -name '*.exe' \
            \) -print0)
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop installer files found" >&2
            exit 1
          fi
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            dmg_files=()
            for file in "${files[@]}"; do
              [[ "$file" = *.dmg ]] && dmg_files+=("$file")
            done
            if [ "${#dmg_files[@]}" -ne 1 ]; then
              echo "Expected exactly one macOS DMG, found ${#dmg_files[@]}" >&2
              exit 1
            fi
            /usr/bin/shasum -a 256 "${dmg_files[0]}" | /usr/bin/sed "s#${dmg_files[0]}#$(basename "${dmg_files[0]}")#" > SHA256SUMS-macos
            files+=(SHA256SUMS-macos)
          fi
          gh release upload "$TAG_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    needs: release-preflight
    if: inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: pnpm install
      - name: Build web
        run: pnpm build
      - name: Add & sync Android (Capacitor)
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find android/app/build/outputs/apk/debug -type f -name '*.apk' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No APK files found" >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
