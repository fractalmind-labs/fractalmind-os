name: release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets for"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  desktop:
    runs-on: [self-hosted, macOS, ARM64, rosex-host, agent-console]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Build Apple Silicon app bundle
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app
      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p dist-release
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist-release/$(basename "$app").zip"
          shasum -a 256 dist-release/*.zip | tee dist-release/SHA256SUMS
      - name: Upload Apple Silicon app to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" dist-release/*.app.zip dist-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
