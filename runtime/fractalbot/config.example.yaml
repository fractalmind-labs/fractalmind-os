# FractalBot configuration (version 2). Reference: docs/config-v2.md
#
# Copy to ~/.config/fractalbot/config.yaml (Linux: $XDG_CONFIG_HOME/fractalbot,
# Windows: %APPDATA%\FractalBot), store each secret with
# `fractalbot secret set <name>`, then run `fractalbot config check`.

version: 2

# Runtime data (inboxes, deduplication, polling offsets, schedule state).
# Default: ~/Library/Application Support/FractalBot on macOS,
# $XDG_STATE_HOME/fractalbot on Linux, %LOCALAPPDATA%\FractalBot on Windows.
# dataDir: ~/.fractalbot

# Default time zone for schedules (IANA name). Default: the system's.
timezone: Asia/Shanghai

gateway:
  bind: 127.0.0.1
  port: 18789
  # allowedOrigins: ["http://localhost:3000"]

# inbound:
#   ackEnabled: true       # reply on the channel before delivering
#   ackMessage: "处理中…"

# Channels: how to reach each chat platform. A configured instance is enabled
# and is referenced as type.name. Secret fields take secret:<name> only.
channels:
  feishu:
    assistant:
      appId: cli_xxxxxxxxxxxxxxxx
      appSecret: secret:feishu-assistant
      # domain: lark           # Lark (international); default feishu
      allowedUsers: [ou_xxxxxxxxxxxxxxxx]

  telegram:
    main:
      botToken: secret:telegram-main
      allowedUsers: [123456789]
      adminId: 123456789       # may use /adduser, /removeuser, /listusers
      # mode: webhook          # default polling
      # webhook:
      #   listenAddr: 127.0.0.1:18790
      #   publicUrl: https://bot.example.com/telegram/webhook
      #   secretToken: secret:telegram-webhook
      # Shared by two agents below: messages that pick no one go to default.
      default: assistant
      # chats:
      #   "-100123456789": researcher   # this group always goes to researcher

  # imessage:                  # macOS only; one account per Mac
  #   main:
  #     recipient: "+8600000000000"
  #     pollIntervalSeconds: 5

  # slack:
  #   main:
  #     botToken: secret:slack-bot
  #     appToken: secret:slack-app

  # discord:
  #   main:
  #     token: secret:discord

# Where this machine keeps secret values. Default store: auto (the OS
# credential store; files on Linux without a session bus; environment
# variables in containers).
# secrets:
#   store: auto
#   overrides:
#     telegram-main:
#       command: [op, read, "op://Private/FractalBot Telegram/token"]

# Runtimes: only tuning. A runtime is used when an agent names it.
# runtimes:
#   claudeDesktop: {deliveryTimeoutSeconds: 20}
#   codexApp: {codex: ~/.local/bin/codex, deliveryTimeoutSeconds: 30}
#   agentManager: {assignTimeoutSeconds: 90, startIfMissing: true}

# Agents: who receives. One runtime each.
agents:
  assistant:
    workspace: ~/workspace/assistant
    runtime: codexApp
    session: 00000000-0000-4000-8000-000000000000   # the Codex thread ID
    channels: [feishu.assistant, telegram.main]

  researcher:
    workspace: ~/workspace/researcher
    runtime: claudeDesktop     # start `fractalbot relay` in its session
    channels: [telegram.main]

  # builder:
  #   workspace: ~/workspace/builder
  #   runtime: agentManager
  #   session: main            # the agent-manager agent; default main

# Schedules: when to wake an agent. The agent decides how it is delivered.
schedules:
  maxConcurrent: 2
  jobs:
    assistant-heartbeat:
      agent: assistant
      cron: "0 * * * *"
      # Levels the agent may switch to when there is nothing to do.
      backoff:
        idle: "0 */3 * * *"
        deep-idle: "0 9 * * *"
      resetOnInbound: true     # a message to this agent restores the cron
      prompt: Read HEARTBEAT.md and follow it. If nothing needs attention, reply HEARTBEAT_OK.

    researcher-morning-report:
      agent: researcher
      cron: "30 7 * * *"
      promptFile: tasks/morning-report.md   # relative to the workspace, read on every run
